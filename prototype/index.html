<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scroll Game</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05030d; overflow:hidden;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: "Trebuchet MS", system-ui, sans-serif; color:#dff; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #gear { position:fixed; top:max(10px, env(safe-area-inset-top)); right:10px; width:42px; height:42px;
    border-radius:50%; border:1px solid #6ff8; background:#0a1020cc; color:#8ff; font-size:22px;
    line-height:40px; text-align:center; padding:0; cursor:pointer; z-index:5; box-shadow:0 0 10px #0ff4; }
  #panel { position:fixed; inset:0; background:#05030dee; z-index:4; display:none; overflow-y:auto;
    padding:60px 18px 24px; box-sizing:border-box; touch-action:pan-y; }
  #panel.open { display:block; }
  #panel h2 { margin:0 0 12px; color:#6ff; letter-spacing:2px; font-size:18px; }
  .row { margin:10px 0; font-size:14px; }
  .row label { display:flex; justify-content:space-between; color:#bdf; }
  .row b { color:#ff6; font-weight:normal; }
  .row input { width:100%; margin:4px 0 0; accent-color:#0ff; }
  #panel button.reset { margin-top:14px; padding:10px 16px; background:#201030; color:#f8f;
    border:1px solid #f8f8; border-radius:6px; font-size:15px; }
  #panel .hint { color:#889; font-size:12px; margin-top:10px; }
  #collBtn { position:fixed; left:50%; transform:translateX(-50%); bottom:max(26px, env(safe-area-inset-bottom));
    min-height:48px; padding:0 26px; border-radius:24px; border:1px solid #6ff; background:#0a1020dd; color:#8ff;
    font:bold 17px/1 "Trebuchet MS", system-ui, sans-serif; letter-spacing:1px; z-index:3; display:none;
    box-shadow:0 0 14px #0ff5; cursor:pointer; }
  #coll { position:fixed; inset:0; z-index:6; background:linear-gradient(#06061a,#14083a); display:none;
    flex-direction:column; padding:max(12px, env(safe-area-inset-top)) 16px 0; box-sizing:border-box; }
  #coll.open { display:flex; }
  .chead { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .chead h2 { margin:0; color:#6ff; letter-spacing:2px; font-size:18px; }
  #collBack { min-height:44px; padding:0 16px; border-radius:10px; border:1px solid #f8f8; background:#201030; color:#f8f;
    font:bold 16px "Trebuchet MS", system-ui, sans-serif; cursor:pointer; }
  #tabs { display:flex; gap:10px; margin-bottom:12px; }
  #tabs button { flex:1; min-height:46px; border-radius:10px; border:1px solid #6ff6; background:#0a1020; color:#9cd;
    font:bold 16px "Trebuchet MS", system-ui, sans-serif; cursor:pointer; }
  #tabs button.on { background:#0e3a4a; color:#fff; border-color:#6ff; box-shadow:0 0 10px #0ff5; }
  #grid { flex:1; overflow-y:auto; touch-action:pan-y; display:grid; grid-template-columns:1fr 1fr; gap:12px;
    align-content:start; grid-auto-rows:min-content; padding-bottom:max(20px, env(safe-area-inset-bottom)); }
  .tile { min-height:132px; border-radius:14px; border:1px solid #6ff4; background:#0a1020cc; color:#dff; padding:8px;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-family:inherit; cursor:pointer; }
  .tile.sel { border-color:#7fff9a; box-shadow:0 0 12px #5f8a; }
  .tile .pv { position:relative; width:100%; height:76px; }
  .tile canvas { width:100%; height:76px; display:block; }
  .tile.locked canvas { filter:brightness(0) invert(.3); opacity:.75; }
  .tile .lock { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; }
  .tile .nm { font-weight:bold; font-size:15px; }
  .tile.locked .nm { color:#889; }
  .tile .st { font-size:12px; color:#8ab; }
  .tile.sel .st { color:#7fff9a; font-weight:bold; }
  #telToggle { width:auto; margin:0; transform:scale(1.4); }
  #telStat { color:#889; font-size:12px; margin-top:4px; }
  #rate { position:fixed; left:0; right:0; bottom:calc(max(26px, env(safe-area-inset-bottom)) + 62px); z-index:3;
    display:none; flex-direction:column; align-items:center; gap:6px; }
  #rate.show { display:flex; }
  #rateQ { font:bold 17px "Trebuchet MS", system-ui, sans-serif; color:#dff; text-shadow:0 0 8px #0ff8; }
  #rateRow { display:flex; gap:14px; }
  #rateRow button { width:64px; height:64px; border-radius:18px; border:1px solid #6ff6; background:#0a1020dd;
    font-size:34px; line-height:1; padding:0; cursor:pointer; }
  #rateRow button.on { border-color:#7fff9a; box-shadow:0 0 14px #5f8a; background:#0e3a4a; transform:scale(1.1); }
  #rateThx { height:18px; font:bold 15px "Trebuchet MS", system-ui, sans-serif; color:#7fff9a; visibility:hidden; }
  #rateThx.show { visibility:visible; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="gear" aria-label="Tuning">&#9881;</button>
<div id="panel"><h2>TUNING</h2><div id="rows"></div>
  <div class="row"><label><span>Send stats</span><input type="checkbox" id="telToggle"></label><div id="telStat"></div></div>
  <button class="reset" id="reset">Reset defaults</button>
  <button class="reset" id="unlockAll">Unlock all (testing)</button>
  <button class="reset" id="resetUnlocks">Reset unlocks</button>
  <div class="hint">Changes apply live. Tap the gear to close and resume.</div></div>
<div id="rate"><div id="rateQ">How fun was that?</div>
  <div id="rateRow"><button data-v="1" aria-label="Not fun">&#x1F61E;</button><button data-v="2" aria-label="OK">&#x1F610;</button><button data-v="3" aria-label="Fun">&#x1F600;</button></div>
  <div id="rateThx">Thanks!</div></div>
<button id="collBtn">Collection</button>
<div id="coll"><div class="chead"><button id="collBack">&larr; Back</button><h2>COLLECTION</h2></div>
  <div id="tabs"><button data-k="balls"></button><button data-k="trails"></button></div>
  <div id="grid"></div></div>
<script>
"use strict";
const TELEMETRY = { url: 'https://ahbfawcyytdrmmxepxjy.supabase.co/rest/v1/runs', key: 'sb_publishable_pWDVpRghWtIJLmDtPlQqag_lGzBQU3x', enabled: true };
const GAME_VERSION = '0.3.0';
// ============================================================
// CONFIG: fixed constants + tunable params (exposed in panel)
// ============================================================
const CONFIG = {
  ballRadius: 13,
  ringRadius: 64,          // visual target ring radius
  startHealth: 100,
  step: 1 / 120,           // fixed physics timestep (s)
  maxFrame: 0.1,           // dt clamp (s)
  restitutionEdge: 0.35,
  edgeLossBase: 1.0,       // edge loss = tuned lossRate*edgeMult*edgeLossBase per s
  stageSeconds: 30,        // seconds (at ramp 1) per background stage
  // Fixed force scalings (the sliders multiply these)
  repulsionUnit: 1.0,      // accel per px beyond sweet spot, per slider unit
  driftUnit: 20,           // px/s^2 per slider unit
  // Palette stages: [bgA, bgB, accent1, accent2, obstacleColour]
  palettes: [
    ['#06061a', '#14083a', '#00e5ff', '#9b5cff', '#2bd9ff'],
    ['#12041f', '#2a0640', '#ff2bd6', '#7a5cff', '#ff4de0'],
    ['#1c0407', '#3a0a0a', '#ff3b30', '#ff9a1f', '#ff6a2b'],
    ['#2a0000', '#000000', '#ff1a1a', '#ffee00', '#ffffff']
  ],
  // Tunables: key -> [default, min, max, step, label]
  tune: {
    sweet:   [24,  8,  60, 1,    'Sweet spot radius'],
    repel:   [4.5, 0,  14, 0.1,  'Repulsion strength'],
    pull:    [0.35, 0, 2,  0.05, 'Centre pull'],
    up:      [22,  0, 120, 1,    'Upward bias'],
    drift:   [3.0, 0, 10,  0.1,  'Random drift strength'],
    damp:    [1.3, 0.2, 4, 0.05, 'Damping'],
    loss:    [4.5, 0, 20,  0.1,  'Health loss rate'],
    edge:    [4,   1, 15,  0.5,  'Edge damage multiplier'],
    spawn:   [1.0, 0.2, 4, 0.05, 'Obstacle spawn rate'],
    ramp:    [1.0, 0, 3,   0.05, 'Difficulty ramp speed']
  }
};
const STORE_BEST = 'scrollgame.best', STORE_TUNE = 'scrollgame.tune';

// Tunable values (live)
const T = {};
for (const k in CONFIG.tune) T[k] = CONFIG.tune[k][0];
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
(function loadTune() {
  try {
    const s = JSON.parse(lsGet(STORE_TUNE) || '{}');
    for (const k in T) if (typeof s[k] === 'number' && isFinite(s[k])) T[k] = s[k];
  } catch (e) {}
})();

// ============================================================
// Canvas + sizing
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 360, H = 640, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (game.target) { game.target.x = clamp(game.target.x, 0, W); game.target.y = clamp(game.target.y, 0, H); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

// ============================================================
// Helpers
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')';
}
function rgba(h, a) { const c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
// Palette (smoothly interpolated) for a fractional stage value
function palette(stageF) {
  const P = CONFIG.palettes, i = Math.min(P.length - 1, Math.floor(stageF)), j = Math.min(P.length - 1, i + 1);
  const t = clamp(stageF - i, 0, 1), s = t * t * (3 - 2 * t);
  return P[i].map((c, n) => mixHex(c, P[j][n], s)).map(rgbToHex);
}
function rgbToHex(s) {
  const m = s.match(/\d+/g).map(Number);
  return '#' + m.map(v => v.toString(16).padStart(2, '0')).join('');
}

// ============================================================
// Game state
// ============================================================
const game = {
  state: 'start',            // start | play | over
  paused: false,             // visibility/panel pause
  t: 0,                      // survival time
  health: CONFIG.startHealth,
  best: parseFloat(lsGet(STORE_BEST)) || 0,
  newBest: false,
  ball: null, target: null, obstacles: [], trailSt: null, unlockedNow: [], dirX: 0, dirY: -1,
  drift: { x: 0, y: 0, tx: 0, ty: 0, timer: 0 },
  spawnTimer: 1.5,
  shake: 0, flash: 0, edgeTouch: false,
  overAt: 0, acc: 0,
  bgT: 0, bgOff: { x: 0, y: 0 }, blobs: []
};
game.stageF = () => game.state === 'play' || game.state === 'over' ? diffTime() / CONFIG.stageSeconds : 0.0;
// Effective "difficulty time" (seconds scaled by ramp speed)
function diffTime() { return game.t * T.ramp; }
// Difficulty level: 0 at start, ~1 at 60s with ramp 1
function level() { return diffTime() / 60; }

function initBlobs() {
  game.blobs = [];
  for (let i = 0; i < 7; i++) game.blobs.push({ x: Math.random(), y: Math.random(), r: rand(0.25, 0.6),
    vx: rand(-0.02, 0.02), vy: rand(-0.02, 0.02), c: i % 2 });
}
initBlobs();

function resetRun() {
  game.t = 0; game.health = CONFIG.startHealth; game.newBest = false;
  game.obstacles = []; game.trailSt = newTrailSt(); game.unlockedNow = []; game.spawnTimer = 1.5;
  game.shake = 0; game.flash = 0; game.acc = 0;
  game.target = { x: W / 2, y: H * 0.32 };
  game.ball = { x: W / 2, y: H * 0.32, vx: 0, vy: 0, r: CONFIG.ballRadius };
  game.drift = { x: 0, y: 0, tx: 0, ty: 0, timer: 0 };
}
function startRun() { telRunStart(); resetRun(); game.state = 'play'; telBegin(); }
function endRun() {
  game.state = 'over'; game.overAt = performance.now();
  const s = game.t;
  if (s > game.best) { game.best = s; game.newBest = true; lsSet(STORE_BEST, String(s)); }
  game.unlockedNow = recordRun(s);
  telEnd();
}

// ============================================================
// Input (relative drag)
// ============================================================
let drag = null; // {id, x, y}
function onDown(e) {
  if (e.target !== canvas) return;
  e.preventDefault();
  telTouch(); lastPtr = e.pointerType === 'touch' ? 'touch' : 'mouse';
  if (game.paused || panelOpen || collOpen) return;
  if (game.state === 'start') { startRun(); }
  else if (game.state === 'over') {
    if (performance.now() - game.overAt > 600) startRun();
    return;
  }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  if (game.state === 'play' && !game.paused && !panelOpen && game.target) {
    if (rs) rs.drag += Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
    game.target.x = clamp(game.target.x + (e.clientX - drag.x), 0, W);
    game.target.y = clamp(game.target.y + (e.clientY - drag.y), 0, H);
  }
  drag.x = e.clientX; drag.y = e.clientY;
}
function onUp(e) { if (drag && e.pointerId === drag.id) drag = null; }
canvas.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
// Block page scroll / zoom / pull-to-refresh
document.addEventListener('touchmove', e => { if (!e.target.closest('#panel, #grid')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
window.addEventListener('blur', autoPause);

// ============================================================
// Tuning panel
// ============================================================
let panelOpen = false;
const panel = document.getElementById('panel'), rowsEl = document.getElementById('rows');
const inputs = {};
function fmt(k, v) { const st = CONFIG.tune[k][3]; return v.toFixed(st < 1 ? (st < 0.1 ? 2 : 1) : 0); }
(function buildPanel() {
  for (const k in CONFIG.tune) {
    const [, mn, mx, st, label] = CONFIG.tune[k];
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<label><span>' + label + '</span><b></b></label><input type="range">';
    const inp = row.querySelector('input'), val = row.querySelector('b');
    inp.min = mn; inp.max = mx; inp.step = st; inp.value = T[k]; val.textContent = fmt(k, T[k]);
    inp.addEventListener('input', () => {
      T[k] = parseFloat(inp.value); val.textContent = fmt(k, T[k]); saveTune();
    });
    inputs[k] = { inp, val };
    rowsEl.appendChild(row);
  }
})();
function saveTune() { lsSet(STORE_TUNE, JSON.stringify(T)); }
document.getElementById('reset').addEventListener('click', () => {
  for (const k in CONFIG.tune) {
    T[k] = CONFIG.tune[k][0]; inputs[k].inp.value = T[k]; inputs[k].val.textContent = fmt(k, T[k]);
  }
  saveTune();
});
document.getElementById('gear').addEventListener('click', () => {
  panelOpen = !panelOpen; panel.classList.toggle('open', panelOpen); drag = null;
  if (panelOpen && rs && game.state === 'play' && !game.paused) rs.paused++;
  telStat();
});
document.getElementById('gear').addEventListener('pointerdown', e => e.stopPropagation());

// ============================================================
// Obstacles
// ============================================================
function spawnObstacle() {
  const L = level(), r = Math.random();
  const kind = r < 0.4 ? 'circle' : r < 0.75 ? 'rect' : 'tri';
  const sizeMul = 1 + 0.5 * L;
  const speed = rand(45, 80) * (1 + 0.45 * L);
  // Enter from top, left or right; travel across the screen
  const side = Math.random();
  let x, y, ang;
  if (side < 0.5) { x = rand(0, W); y = -90; ang = Math.PI / 2 + rand(-0.6, 0.6); }
  else if (side < 0.75) { x = -90; y = rand(0, H * 0.7); ang = rand(-0.3, 0.7); }
  else { x = W + 90; y = rand(0, H * 0.7); ang = Math.PI - rand(-0.3, 0.7); }
  const o = { kind, x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, rot: rand(0, 6.28), spin: rand(-0.6, 0.6),
    seen: false, hue: Math.random() };
  if (kind === 'rect') { // wall (axis-aligned for collision)
    const horiz = Math.random() < 0.5, len = rand(90, 170) * sizeMul, th = rand(16, 24) * Math.min(sizeMul, 1.8);
    o.w = horiz ? len : th; o.h = horiz ? th : len; o.spin = 0; o.rot = 0;
  } else { o.r = rand(24, 42) * sizeMul; }
  game.obstacles.push(o);
}
function collideObstacle(b, o) {
  let nx, ny, pen;
  if (o.kind === 'rect') {
    const hw = o.w / 2, hh = o.h / 2;
    const cx = clamp(b.x, o.x - hw, o.x + hw), cy = clamp(b.y, o.y - hh, o.y + hh);
    let dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
    if (d2 > b.r * b.r) return false;
    if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = b.r - d; }
    else { // centre inside rect: exit along shortest axis
      const px = hw - Math.abs(b.x - o.x), py = hh - Math.abs(b.y - o.y);
      if (px < py) { nx = Math.sign(b.x - o.x) || 1; ny = 0; pen = px + b.r; }
      else { nx = 0; ny = Math.sign(b.y - o.y) || 1; pen = py + b.r; }
    }
  } else {
    const rr = o.kind === 'tri' ? o.r * 0.8 : o.r;
    const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy);
    if (d > rr + b.r) return false;
    nx = d > 1e-6 ? dx / d : 0; ny = d > 1e-6 ? dy / d : -1; pen = rr + b.r - d;
  }
  b.x += nx * pen; b.y += ny * pen;
  // Impulse: reflect relative velocity + guaranteed shove
  const rvn = (b.vx - o.vx) * nx + (b.vy - o.vy) * ny;
  if (rvn < 0) { b.vx -= 1.5 * rvn * nx; b.vy -= 1.5 * rvn * ny; }
  b.vx += nx * 60; b.vy += ny * 60;
  return true;
}

// ============================================================
// Simulation
// ============================================================
function step(dt) {
  const g = game, b = g.ball, tg = g.target, L = level();
  g.t += dt;

  // Smooth random drift: lerp toward a periodically re-rolled target vector
  const dr = g.drift;
  dr.timer -= dt;
  if (dr.timer <= 0) {
    dr.timer = rand(0.8, 2.2) / (1 + 0.4 * L);
    const a = rand(0, 6.283); dr.tx = Math.cos(a); dr.ty = Math.sin(a) * 0.8;
  }
  const k = 1 - Math.exp(-dt * 1.6);
  dr.x += (dr.tx - dr.x) * k; dr.y += (dr.ty - dr.y) * k;

  // Forces on the ball (accelerations)
  let ax = 0, ay = 0;
  const dx = b.x - tg.x, dy = b.y - tg.y, d = Math.hypot(dx, dy) || 1e-6;
  const excess = Math.max(0, d - T.sweet);
  const repel = T.repel * (1 + 0.55 * L) * CONFIG.repulsionUnit * excess;   // (a) away from target
  ax += dx / d * repel; ay += dy / d * repel;
  ax += (W / 2 - b.x) * T.pull; ay += (H * 0.4 - b.y) * T.pull;             // (b) towards screen centre
  ay -= T.up;                                                                // (c) upward bias
  const ds = T.drift * (1 + 0.6 * L) * CONFIG.driftUnit;                     // (d) drift
  ax += dr.x * ds; ay += dr.y * ds;
  b.vx += ax * dt; b.vy += ay * dt;
  const damp = Math.exp(-T.damp * dt); b.vx *= damp; b.vy *= damp;
  b.x += b.vx * dt; b.y += b.vy * dt;

  // Obstacles (e): move, collide, cull
  g.spawnTimer -= dt;
  if (g.spawnTimer <= 0) { spawnObstacle(); g.spawnTimer = rand(1.4, 2.4) / (T.spawn * (1 + 0.7 * L)); }
  for (let i = g.obstacles.length - 1; i >= 0; i--) {
    const o = g.obstacles[i];
    o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.spin * dt;
    const m = (o.kind === 'rect' ? Math.max(o.w, o.h) : o.r) + 140;
    if (o.x < -m || o.x > W + m || o.y < -m || o.y > H + m) {
      if (o.seen || o.age > 8) { g.obstacles.splice(i, 1); continue; }
    }
    o.age = (o.age || 0) + dt;
    if (o.x > -20 && o.x < W + 20 && o.y > -20 && o.y < H + 20) o.seen = true;
    if (collideObstacle(b, o)) { g.shake = Math.max(g.shake, 3); telHit(o); }
  }

  // Screen edges: clamp + light bounce
  let edge = false; const e = CONFIG.restitutionEdge;
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * e; edge = true; }
  if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * e; edge = true; }
  if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * e; edge = true; }
  if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * e; edge = true; }
  g.edgeTouch = edge;

  // Health: none in sweet spot, grows with distance, much faster on edge
  const lossD = T.loss * (excess / 40) * (1 + 0.5 * L);
  let lossE = 0;
  if (edge) { lossE = T.loss * T.edge * CONFIG.edgeLossBase * 1.5 + 6; g.shake = Math.max(g.shake, 4); g.flash = Math.min(0.35, g.flash + dt * 2); }

  if (loss > 0) { const f = Math.min(g.health, loss * dt) / loss; telStep(dt, d, edge, lossD * f, lossE * f); }
  else telStep(dt, d, edge, 0, 0);
  g.health -= loss * dt;
  if (g.health <= 0) { g.health = 0; endRun(); }
}

function update(frameDt) {
  const g = game;
  g.bgT += frameDt;
  // Background always drifts
  const sf = g.stageF();
  g.bgOff.x += Math.cos(g.bgT * 0.17) * 22 * frameDt * (1 + sf);
  g.bgOff.y += (14 + Math.sin(g.bgT * 0.11) * 10) * frameDt * (1 + sf);
  for (const bl of g.blobs) {
    bl.x += bl.vx * frameDt * (1 + sf); bl.y += bl.vy * frameDt * (1 + sf);
    if (bl.x < -0.2 || bl.x > 1.2) bl.vx *= -1;
    if (bl.y < -0.2 || bl.y > 1.2) bl.vy *= -1;
  }
  g.shake *= Math.exp(-frameDt * 10); g.flash *= Math.exp(-frameDt * 6);
  if (g.state === 'play' && !g.paused && !panelOpen) {
    g.acc += frameDt;

  }
  if (g.ball) { // cosmetic: smoothed travel direction + trail
    const sp = Math.hypot(g.ball.vx, g.ball.vy), k = 1 - Math.exp(-frameDt * 10);
    if (sp > 8) { g.dirX += (g.ball.vx / sp - g.dirX) * k; g.dirY += (g.ball.vy / sp - g.dirY) * k; }
    trailUpdate(g.trailSt, selItem('trails').id, g.ball.x, g.ball.y, frameDt, g.state === 'play' && !g.paused && !panelOpen);

}

// ---- Trails: state is {pts, parts}; one code path for the game and the previews ----

function trailUpdate(st, id, x, y, dt, active) {

  while (st.pts.length && st.pts[0].age > TRAIL_LIFE) st.pts.shift();
  if (active) st.pts.push({ x, y, age: 0 });

    for (let i = 0; i < 2; i++) st.parts.push({ x, y, vx: rand(-70, 70), vy: rand(-70, 70), life: 0, max: rand(0.35, 0.7), sz: rand(0.6, 1.4) });

// ---- Persistence + unlock rules ----
function lsJSON(k, def) { try { const v = JSON.parse(lsGet(k)); return v == null ? def : v; } catch (e) { return def; } }

(function () { const s = lsJSON(STORE_PROG, {}); prog.runs = +s.runs || 0; prog.best = Math.max(+s.best || 0, game.best); })();

(function () { const s = lsJSON(STORE_SEL, {}); for (const k in sel) if (typeof s[k] === 'string') sel[k] = s[k]; })();

}

  prog.runs++; prog.best = Math.max(prog.best, seconds);
  const fresh = [];
  for (const kind in LISTS) for (const it of LISTS[kind]) {
    if (!isUnlocked(kind, it) && unlockMet(it)) { unlocked.add(ukey(kind, it)); fresh.push(it.name); }
  }

}

  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, pal[0]); grd.addColorStop(1, pal[1]);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  // Soft drifting colour blobs
  ctx.globalCompositeOperation = 'lighter';
  for (const bl of g.blobs) {
    const x = bl.x * W, y = bl.y * H, r = bl.r * Math.max(W, H);
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    const c = bl.c ? pal[3] : pal[2];
    rg.addColorStop(0, rgba(c, 0.16 + 0.05 * sf)); rg.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  // Scrolling perspective-less neon grid
  const cell = 64, ox = ((g.bgOff.x % cell) + cell) % cell, oy = ((g.bgOff.y % cell) + cell) % cell;
  ctx.strokeStyle = rgba(pal[2], 0.10 + 0.04 * sf); ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -ox; x < W + cell; x += cell) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -oy; y < H + cell; y += cell) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawObstacle(o, pal) {
  const col = o.hue < 0.5 ? pal[4] : pal[3];
  ctx.save(); glow(col, 14);
  ctx.strokeStyle = col; ctx.fillStyle = rgba(col, 0.14); ctx.lineWidth = 2.5;
  if (o.kind === 'rect') {
    ctx.beginPath(); ctx.rect(o.x - o.w / 2, o.y - o.h / 2, o.w, o.h); ctx.fill(); ctx.stroke();
  } else if (o.kind === 'circle') {
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.283); ctx.fill(); ctx.stroke();
  } else {
    ctx.translate(o.x, o.y); ctx.rotate(o.rot); ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = i * 2.094 - 1.571; ctx.lineTo(Math.cos(a) * o.r, Math.sin(a) * o.r); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function ringColor(ratio) { // green -> yellow -> red
  const r = clamp(ratio, 0, 1);
  const h = 120 - r * 120;
  return 'hsl(' + h + ',100%,55%)';
}

function drawTarget() {
  const g = game, tg = g.target, b = g.ball;
  const d = Math.hypot(b.x - tg.x, b.y - tg.y);
  const col = ringColor((d - T.sweet) / (CONFIG.ringRadius * 1.6));
  ctx.save();
  glow(col, 18); ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(tg.x, tg.y, CONFIG.ringRadius, 0, 6.283); ctx.stroke();
  // Sweet spot
  ctx.lineWidth = 2; ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.arc(tg.x, tg.y, T.sweet, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  noGlow(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tg.x, tg.y, 2.5, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawBall(pal) {
  const g = game, b = g.ball;
  trailDraw(ctx, g.trailSt, selItem('trails').id, b.r, pal[2]);
  ballDraw(ctx, selItem('balls').id, b.x, b.y, b.r, g.bgT, Math.atan2(g.dirY, g.dirX), pal[2]);
}

function fmtTime(s) { return s.toFixed(1); }
function textCenter(str, y, size, color, blur) {
  ctx.font = 'bold ' + size + 'px "Trebuchet MS", system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glow(color, blur || 12); ctx.fillStyle = color; ctx.fillText(str, W / 2, y); noGlow();
}

function drawHUD(pal) {
  const g = game;
  textCenter(fmtTime(g.t), 58, 54, '#ffffff', 16);
  // Health bar
  const bw = Math.min(W - 40, 320), bx = (W - bw) / 2, by = 96, bh = 12, hp = g.health / CONFIG.startHealth;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx, by, bw, bh);
  const hc = ringColor(1 - hp);
  ctx.save(); glow(hc, 10); ctx.fillStyle = hc; ctx.fillRect(bx, by, bw * hp, bh); ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
  ctx.font = '13px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText('BEST ' + fmtTime(g.best), 14, 20);
}

function drawOverlayScreens(pal) {
  const g = game;
  if (g.state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    textCenter('SCROLL GAME', H * 0.3, Math.min(48, W / 7.5), pal[2], 24);
    textCenter('Drag to keep the ball centred', H * 0.3 + 52, 18, '#dff', 6);
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
    ctx.globalAlpha = pulse; textCenter('TAP TO START', H * 0.55, 28, '#ffee66', 14); ctx.globalAlpha = 1;
    textCenter('Best: ' + fmtTime(g.best) + 's', H * 0.55 + 50, 20, '#fff', 6);
  } else if (g.state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    textCenter('GAME OVER', H * 0.25, 40, '#ff3b5c', 22);
    textCenter(fmtTime(g.t) + 's', H * 0.37, 64, '#ffffff', 18);
    textCenter('Best: ' + fmtTime(g.best) + 's', H * 0.46, 22, '#9ff', 8);
    if (g.newBest) textCenter('NEW BEST!', H * 0.53, 30, '#ffee00', 20);
    const un = g.unlockedNow;
    for (let i = 0; i < Math.min(un.length, 3); i++) textCenter('Unlocked: ' + un[i] + '!', H * 0.585 + i * 30, 22, '#7fff9a', 12);
    if (un.length > 3) textCenter('+' + (un.length - 3) + ' more', H * 0.585 + 90, 16, '#7fff9a', 6);
    if (performance.now() - g.overAt > 600) {
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.globalAlpha = pulse; textCenter('TAP TO RETRY', Math.min(H * 0.72, H - 236), 26, '#ffffff', 12); ctx.globalAlpha = 1;
    }
  }
  if (g.paused && g.state === 'play' && !panelOpen) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    textCenter('PAUSED', H * 0.4, 40, '#fff', 14);
    textCenter('Tap to resume', H * 0.4 + 46, 20, '#9ff', 6);
  }
}

function render() {
  const g = game, pal = palette(g.stageF());
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (g.shake > 0.2) ctx.translate(rand(-g.shake, g.shake), rand(-g.shake, g.shake));
  drawBackground(pal);
  if (g.state !== 'start') {
    for (const o of g.obstacles) drawObstacle(o, pal);
    drawTarget(); drawBall(pal);
  } else {
    // idle demo ring
    ctx.save(); glow(pal[2], 18); ctx.strokeStyle = pal[2]; ctx.lineWidth = 3; ctx.beginPath();
    ctx.arc(W / 2, H * 0.78, CONFIG.ringRadius, 0, 6.283); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  // Edge flash vignette
  if (g.flash > 0.02) {
    const rg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    rg.addColorStop(0, 'rgba(255,0,0,0)'); rg.addColorStop(1, 'rgba(255,30,30,' + g.flash + ')');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  if (g.state !== 'start') drawHUD(pal);
  drawOverlayScreens(pal);
}

// Tap to resume after auto-pause
window.addEventListener('pointerdown', e => {
  if (game.paused && !panelOpen && e.target === canvas) { game.paused = false; telClearInProg(); }
}, true);

// ============================================================
// Telemetry: per-run stats -> localStorage queue -> Supabase (best effort, never blocks play)
// ============================================================
const STORE_PID = 'scrollgame.pid', STORE_TQ = 'scrollgame.tq', STORE_TSENT = 'scrollgame.tsent',
  STORE_TON = 'scrollgame.telon', STORE_PLAYTIME = 'scrollgame.playtime', STORE_RUNNO = 'scrollgame.runno';
const TQ_MAX = 200, SESSION_GAP = 600000;
let rs = null;            // stats for the run in progress
let pending = null;       // finished run awaiting retry/rating: {rec, rating, overAt}
let lastPtr = 'mouse', flushing = false;
let tq = lsJSON(STORE_TQ, []); if (!Array.isArray(tq)) tq = [];
let tsent = parseInt(lsGet(STORE_TSENT), 10) || 0;
let telOn = () => TELEMETRY.enabled && lsGet(STORE_TON) !== '0';

function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  const h = new Uint8Array(16);
  try { crypto.getRandomValues(h); } catch (e) { for (let i = 0; i < 16; i++) h[i] = Math.floor(Math.random() * 256); }
  h[6] = (h[6] & 15) | 64; h[8] = (h[8] & 63) | 128;
  return h.map((v, i) => (i === 4 || i === 6 || i === 8 || i === 10 ? '-' : '') + v.toString(16).padStart(2, '0')).join('');
}
let playerId = lsGet(STORE_PID);
if (!playerId || playerId.length < 8) { playerId = uuid(); lsSet(STORE_PID, playerId); }
let sessionId = uuid(), lastActive = Date.now();
function telTouch() { const n = Date.now(); if (n - lastActive > SESSION_GAP) sessionId = uuid(); lastActive = n; }
function deviceString() {
  const ua = navigator.userAgent || '';
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /CrOS/.test(ua) ? 'ChromeOS'
    : /Windows/.test(ua) ? 'Windows' : /Mac OS X|Macintosh/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Other';
  const br = /EdgA?\/|EdgiOS/.test(ua) ? 'Edge' : /OPR\/|Opera/.test(ua) ? 'Opera' : /Firefox|FxiOS/.test(ua) ? 'Firefox'
    : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'Other';
  const s = window.screen || {};
  return os + ' / ' + br + ', ' + (s.width || 0) + 'x' + (s.height || 0);
}
const r2 = v => isFinite(v) ? Math.round(v * 100) / 100 : 0;

function telStat() {
  const el = document.getElementById('telStat');
  if (el) el.textContent = 'Queued: ' + tq.length + ' · Sent: ' + tsent;
}
function telSave() { lsSet(STORE_TQ, JSON.stringify(tq)); lsSet(STORE_TSENT, String(tsent)); telStat(); }
(function () {
  const t = document.getElementById('telToggle');
  t.checked = telOn();
  t.addEventListener('change', () => { lsSet(STORE_TON, t.checked ? '1' : '0'); if (t.checked) flush(false); });
  telStat();
})();

// ---- run lifecycle ----
function telBegin() {
  try {
    telTouch(); telClearInProg();
    const n = (parseInt(lsGet(STORE_RUNNO), 10) || 0) + 1; lsSet(STORE_RUNNO, String(n));
    const cfg = CONFIG, set = Object.assign({}, T, { ring_radius: cfg.ringRadius, ball_radius: cfg.ballRadius, start_health: cfg.startHealth,
      edge_restitution: cfg.restitutionEdge, edge_loss_base: cfg.edgeLossBase, stage_seconds: cfg.stageSeconds });
    rs = { playedAt: new Date().toISOString(), session: sessionId, runNo: n, settings: set, setStr: JSON.stringify(T),
      ball: selItem('balls').id, trail: selItem('trails').id, vw: W, vh: H, input: lastPtr,
      zS: 0, zI: 0, zO: 0, zX: 0, distSum: 0, tAcc: 0, coll: 0, edgeN: 0, edgeT: 0, lostD: 0, lostE: 0,
      drag: 0, paused: 0, bk: {}, lastEdge: -9, done: false };
  } catch (e) { rs = null; }
}
function telStep(dt, d, edge, lD, lE) {
  const r = rs; if (!r) return;
  const R = CONFIG.ringRadius;
  if (d <= T.sweet) r.zS += dt; else if (d <= R * 0.5) r.zI += dt; else if (d <= R) r.zO += dt; else r.zX += dt;
  r.distSum += d * dt; r.tAcc += dt; r.lostD += lD; r.lostE += lE;
  const k = Math.floor(game.t * 4), b = r.bk[k] || (r.bk[k] = { t: 0, d: 0, e: 0, c: 0 });
  b.t += dt; b.d += d * dt;
  if (edge) {
    r.edgeT += dt; b.e += dt;
    if (game.t - r.lastEdge > 0.15) { r.edgeN++; }
    r.lastEdge = game.t;
  }
}
function telHit(o) { // a distinct contact = not touching the same shape within the last 0.15s
  const r = rs; if (!r) return;
  if (game.t - (o.lastHit === undefined ? -9 : o.lastHit) > 0.15) { r.coll++; const b = r.bk[Math.floor(game.t * 4)]; if (b) b.c++; else r.bk[Math.floor(game.t * 4)] = { t: 0, d: 0, e: 0, c: 1 }; }
  o.lastHit = game.t;
}
function buildRecord(endedBy, noCommit) {
  const r = rs, g = game, dur = g.t, R = CONFIG.ringRadius, ta = r.tAcc || 1e-9;
  const life = (parseFloat(lsGet(STORE_PLAYTIME)) || 0) + dur; if (!noCommit) lsSet(STORE_PLAYTIME, String(life));
  let wt = 0, wd = 0, we = 0, wc = 0;
  const from = Math.floor(Math.max(0, dur - 5) * 4);
  for (const k in r.bk) if (+k >= from) { const b = r.bk[k]; wt += b.t; wd += b.d; we += b.e; wc += b.c; }
  const avg = r.distSum / ta;
  return {
    played_at: r.playedAt, player_id: playerId, session_id: r.session, game_version: GAME_VERSION, device: deviceString(),
    run_number: r.runNo, settings: r.settings,
    stats: {
      duration: r2(dur), lifetime_play_time: r2(life), run_number: r.runNo, stage_reached: Math.floor(g.t * T.ramp / CONFIG.stageSeconds) + 1,
      time_in_sweet_spot: r2(r.zS), time_in_inner: r2(r.zI), time_in_outer: r2(r.zO), time_outside_target: r2(r.zX),
      avg_distance_from_centre_px: r2(avg), avg_distance_from_centre_frac: r2(avg / R),
      shape_collisions: r.coll, edge_touches: r.edgeN, edge_contact_time: r2(r.edgeT),
      health_lost_distance: r2(r.lostD), health_lost_edge: r2(r.lostE),
      last5s: { avg_distance_frac: r2(wt > 0 ? wd / wt / R : 0), edge_contact_time: r2(we), shape_collisions: wc },
      drag_distance_px: r2(r.drag), retry_delay_s: null, paused_count: r.paused,
      viewport: { w: r.vw, h: r.vh }, input: r.input, ball: r.ball, trail: r.trail,
      tuned_mid_run: JSON.stringify(T) !== r.setStr
    },
    fun_rating: null, ended_by: endedBy
  };
}
function telRunStart() { // next run is starting: finalise the previous one with its retry delay
  try { telTouch(); telFinalize(true); } catch (e) {}
}
function telEnd() {
  try {
    telTouch();
    if (!rs || rs.done) return;
    rs.done = true; telClearInProg();
    pending = { rec: buildRecord('death'), rating: null, overAt: game.overAt };
    rateUI();
  } catch (e) {}
}
function telFinalize(retried, keepalive) {
  const p = pending; if (!p) return;
  pending = null;
  try {
    if (p.rating) p.rec.fun_rating = p.rating;
    if (retried) p.rec.stats.retry_delay_s = r2((performance.now() - p.overAt) / 1000);
    enqueue(p.rec, keepalive);
  } catch (e) {}
  rateUI();
}
function autoPause() {
  if (rs && game.state === 'play' && !game.paused && !panelOpen) rs.paused++;
  game.paused = true;
}
const STORE_INPROG = 'scrollgame.inProgressRun';
function telClearInProg() { try { localStorage.removeItem(STORE_INPROG); } catch (e) {} }
function telHide(unload) {
  try {
    if (game.state === 'play' && rs && !rs.done) {
      if (unload) { rs.done = true; telClearInProg(); enqueue(buildRecord('quit'), true); }
      else lsSet(STORE_INPROG, JSON.stringify(buildRecord('quit', true))); // brief app switch: keep a local copy only
    } else if (pending) telFinalize(false, true);
    else flush(true);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.hidden) telHide(false); });
window.addEventListener('pagehide', () => telHide(true));

// ---- queue + network ----
function enqueue(rec, keepalive) {
  if (!telOn()) return;
  tq.push(rec); while (tq.length > TQ_MAX) tq.shift();
  telSave(); flush(keepalive);
}
async function flush(keepalive) {
  if (!telOn() || flushing || !tq.length || typeof fetch !== 'function') return;
  flushing = true;
  try {
    while (tq.length && telOn()) {
      const batch = tq.slice(0, keepalive ? 20 : 50);
      let res;
      try {
        res = await fetch(TELEMETRY.url, { method: 'POST', keepalive: !!keepalive, body: JSON.stringify(batch),
          headers: { apikey: TELEMETRY.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' } });
      } catch (e) { break; }
      if (!res || !res.ok) break;
      tq = tq.filter(x => batch.indexOf(x) < 0); tsent += batch.length; telSave();
    }
  } catch (e) {}
  flushing = false;
}
window.addEventListener('online', () => flush(false));
setInterval(() => flush(false), 30000);
(function () { // a run left in progress by a killed tab (no pagehide): record it as abandoned
  try {
    const rec = lsJSON(STORE_INPROG, null); telClearInProg();
    if (rec && rec.stats && rec.player_id) {
      rec.ended_by = 'abandoned';
      const lt = parseFloat(lsGet(STORE_PLAYTIME)) || 0; if (rec.stats.lifetime_play_time > lt) lsSet(STORE_PLAYTIME, String(rec.stats.lifetime_play_time));
      enqueue(rec, false);
    }
  } catch (e) {}
})();
flush(false);

// ---- fun rating UI (DOM, above the canvas; its taps never reach the retry handler) ----
const rateEl = document.getElementById('rate'), thxEl = document.getElementById('rateThx');
const rateBtns = Array.from(document.querySelectorAll('#rateRow button'));
function rateUI() {
  const v = pending ? pending.rating : null;
  rateBtns.forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  thxEl.classList.toggle('show', !!v);
}
rateBtns.forEach(b => {
  for (const ev of ['pointerdown', 'pointerup', 'touchstart', 'mousedown']) b.addEventListener(ev, e => e.stopPropagation());
  b.addEventListener('click', e => { e.stopPropagation(); if (pending) { pending.rating = +b.dataset.v; rateUI(); } });
});
let rateShown = false;
function telSyncRate() {
  const g = game, show = !!pending && g.state === 'over' && !collOpen && !panelOpen && performance.now() - g.overAt > 600;
  if (show !== rateShown) { rateShown = show; rateEl.classList.toggle('show', show); if (show) rateUI(); }
}

// ============================================================
// Main loop
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, CONFIG.maxFrame); last = now;
  update(dt); render(); syncCollBtn(); telSyncRate();
  requestAnimationFrame(frame);
}
resize();
resetRun();
window.__TEST_HOOKS = { game, prog, tel: { get queue() { return tq; }, get pending() { return pending; }, get rs() { return rs; }, get sent() { return tsent; }, flush } }; // test-only hook (Playwright)
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
