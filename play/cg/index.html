  /* Fixed logical stage (STAGE_W x STAGE_H), scaled to fit and letterboxed. --s = current scale. */
  html, body { background: radial-gradient(ellipse at center, #120a2a 0%, #05030d 70%); }
  #stage { --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; --disp: "NB Display", var(--ui); position:fixed; left:0; top:0; width:450px; height:648px; transform-origin:0 0; overflow:hidden; background:#05030d; --s:1; }
  /* keep small DOM text >= ~12 screen px when the stage is scaled down */
  .tile .st, .tile .nm, #telStat, #panel .hint, .row { font-size:max(12px, calc(12px / var(--s))); }

  #tabs { gap:6px; } #tabs button { font-size:13px; padding:0 2px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; line-height:1.15; }
  #tabs .ti { font-size:17px; } #tabs .tl { font-size:max(12px, calc(12px / var(--s))); }
  .mhead { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; color:#dff; font-size:16px; padding:2px 4px; }
  .mhead b { color:#ffd84d; } .mhead span:last-child i { display:inline-block; vertical-align:middle; height:8px; width:0; max-width:90px; background:#6ff; margin-left:8px; border-radius:4px; }
  .mrow { grid-column:1/-1; display:flex; align-items:center; gap:10px; border:1px solid #6ff4; background:#0a1020cc; border-radius:14px; padding:10px 12px; color:#dff; }
  .mrow .tx { flex:1; } .mrow b { display:block; font-size:16px; } .mrow small { color:#8ab; font-size:max(13px, calc(12px / var(--s))); } .mrow em { display:block; font-style:normal; color:#7fff9a; letter-spacing:2px; font-size:12px; } .mrow em s { text-decoration:none; color:#345; }
  .mrow button { min-height:44px; min-width:84px; border-radius:10px; border:1px solid #7fff9a; background:#0e3a4a; color:#fff; font:bold 15px var(--ui); cursor:pointer; }
  .mrow button:disabled { opacity:.45; border-color:#6ff4; cursor:default; } .mrow.done { border-color:#7fff9a; }

  /* top icon rail: inline SVG icons, labelled on the menu screens */
  #rail { position:absolute; top:10px; left:10px; display:flex; gap:14px; z-index:5; align-items:flex-start; }
  #rail button { position:relative; width:48px; height:48px; border-radius:50%; border:1.5px solid #6ff8; background:#0a1020cc; color:#9ff; padding:0; cursor:pointer; box-shadow:0 0 10px #0ff3; }
  #rail svg { width:26px; height:26px; display:block; margin:auto; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  #rail button span { position:absolute; left:50%; top:52px; transform:translateX(-50%); font:600 max(11px, calc(12px / var(--s))) var(--ui); color:#9cd; letter-spacing:.3px; white-space:nowrap; pointer-events:none; }
  #rail button:hover { border-color:#6ff; color:#fff; }
  #mute .off { display:none; } #mute.off .on { display:none; } #mute.off .off { display:inline; } #mute.off { color:#789; }
  #rail .dot { position:absolute; top:-2px; right:-2px; width:13px; height:13px; border-radius:50%; background:#ffd84d; border:2px solid #0a1020; box-shadow:0 0 8px #fd4; display:none; }
  #rail .dot.on { display:block; }
  #stage[data-st=play] #rail .rb:not(.keep) { display:none; }
  #rail #rPause { display:none; } #stage[data-st=play] #rail #rPause { display:block; }

  .mrow svg.up { flex:none; width:56px; height:40px; }
  .cal { grid-column:1/-1; display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
  .cal .dc { border:1px solid #6ff4; background:#0a1020cc; border-radius:10px; padding:5px 2px; text-align:center; color:#8ab; }
  .cal .dc small { display:block; font-size:max(11px, calc(11px / var(--s))); } .cal .dc b { font-size:14px; color:#dff; }
  .cal .dc.past { border-color:#7fff9a88; } .cal .dc.past b { color:#7fff9a; }
  .cal .dc.today { border-color:#ffd84d; box-shadow:0 0 12px #fd48; } .cal .dc.today b { color:#ffd84d; }
  .cal .dc.big { grid-column:1/-1; padding:9px; border-color:#ff8ae6aa; } .cal .dc.big b { font-size:20px; } .cal .dc.big em { display:block; font-style:normal; font-size:12px; letter-spacing:2px; color:#ff8ae6; }

  /* game-over DOM buttons (positions follow the canvas layout; --oy centres the block on tall fields) */
  @keyframes fin { from { opacity:0; } to { opacity:1; } }
  #retry, #goUp { position:absolute; left:50%; transform:translateX(-50%); display:none; z-index:3; cursor:pointer; font-family:var(--disp); color:#fff; }
  #retry.show, #goUp.show { display:block; animation:fin .3s; }
  #retry { top:calc(498px + var(--oy, 0px)); width:280px; height:64px; border-radius:32px; border:2px solid #dff; background:linear-gradient(#19c8dc,#0b7f9c); font-size:28px; letter-spacing:3px; box-shadow:0 0 26px #0ff7; text-shadow:0 1px 0 #0468; }
  #retry:hover { filter:brightness(1.12); }
  #goUp { top:calc(428px + var(--oy, 0px)); min-width:280px; height:50px; padding:0 22px; border-radius:25px; border:1.5px solid #ffd84d; background:#2a2208ee; color:#ffd84d; font-size:16px; letter-spacing:1.5px; box-shadow:0 0 16px #fd45; white-space:nowrap; }
  #goUp:hover { background:#3a300cee; }

  /* settings + streak sheets */
  #settings, #streak { position:absolute; inset:0; z-index:7; background:#05030dd9; display:none; align-items:center; justify-content:center; }
  #settings.open, #streak.open { display:flex; }
  .card { width:366px; box-sizing:border-box; padding:16px; border-radius:18px; border:1px solid #6ff8; background:linear-gradient(#0c1030,#160a3c); box-shadow:0 0 30px #0ff3; display:flex; flex-direction:column; gap:10px; }
  .card h2 { margin:0; color:#6ff; letter-spacing:2px; font-size:18px; text-align:center; }
  .card p { margin:0; text-align:center; color:#dff; font-size:15px; }
  .card .mrow { grid-column:auto; }
  .card button.big { min-height:48px; border-radius:12px; border:1px solid #6ff; background:#0e3a4a; color:#fff; font:bold 17px var(--ui); cursor:pointer; }

  /* wide screens: neon letterbox + side panels (the 450x800 stage is unchanged) */
  body::before { content:""; position:fixed; inset:0; pointer-events:none; background-image:linear-gradient(#6ff1 1px, transparent 1px), linear-gradient(90deg, #6ff1 1px, transparent 1px); background-size:64px 64px; -webkit-mask-image:radial-gradient(ellipse at center, #000 5%, transparent 75%); mask-image:radial-gradient(ellipse at center, #000 5%, transparent 75%); }

<script>
"use strict";
const BUILD = {"target":"crazygames","devUI":false,"telemetry":false};
// Platform adapter. 'web' = no-ops + localStorage. 'crazygames' = SDK v3 (Basic Launch: init + gameplayStart/Stop only; no ads).
const _cg = () => { try { return BUILD.target === 'crazygames' && window.CrazyGames && window.CrazyGames.SDK; } catch (e) { return null; } };
const PLATFORM = {
  name: BUILD.target,
  locale: (navigator.language || 'en').slice(0, 2),
  ready: false,
  init() { const s = _cg(); if (!s) return; try { Promise.resolve(s.init()).then(() => { PLATFORM.ready = true; try { s.game.loadingStart(); s.game.loadingStop(); if (PLATFORM.playing) s.game.gameplayStart(); } catch (e) {} }).catch(() => {}); } catch (e) {} },
  playing: false,

  gameplayStop() { PLATFORM.playing = false; const s = _cg(); if (s && PLATFORM.ready) try { s.game.gameplayStop(); } catch (e) {} },
  adBreak(done) { done(); },                      // Full Launch only: midgame ad after game over; always continues if no fill
};
PLATFORM.init();

const TELEMETRY = { url: 'https://ahbfawcyytdrmmxepxjy.supabase.co/rest/v1/runs', key: 'sb_publishable_pWDVpRghWtIJLmDtPlQqag_lGzBQU3x', enabled: BUILD.telemetry && !/[?&]notel=1/.test(location.search) };
const GAME_VERSION = '1.0.0' + (BUILD.target === 'web' ? '' : '+' + BUILD.target);
// ============================================================
// CONFIG: fixed constants + tunable params (exposed in panel)
// ============================================================
const CONFIG = {
  ballRadius: 13,
  ringRadius: 64,          // visual target ring radius
  startHealth: 100,
  step: 1 / 120,           // fixed physics timestep (s)
  maxFrame: 0.1,           // dt clamp (s)
  edgeLossBase: 1.0,
  edgeBase: 4.5,           // edge-loss base rate (independent of the distance-loss slider)       // edge loss = tuned lossRate*edgeMult*edgeLossBase per s
  stageNames: ['CALM', 'PULSE', 'HEAT', 'REDLINE', 'TOXIC', 'SOLAR', 'VOID', 'BULLSEYE'],
  stageSeconds: 30,        // seconds (at ramp 1) per background stage
  // Fixed force scalings (the sliders multiply these)
  repulsionUnit: 1.0,      // accel per px beyond sweet spot, per slider unit
  driftUnit: 20,           // px/s^2 per slider unit
  // Palette stages: [bgA, bgB, accent1, accent2, obstacleColour]
  palettes: [
    ['#06061a', '#14083a', '#00e5ff', '#9b5cff', '#2bd9ff'],
    ['#12041f', '#2a0640', '#ff2bd6', '#7a5cff', '#ff4de0'],
    ['#1c0407', '#3a0a0a', '#ff3b30', '#ff9a1f', '#ff6a2b'],
    ['#2a0000', '#000000', '#ff1a1a', '#ffee00', '#ffffff'],
    ['#00141a', '#001f1a', '#00ffa3', '#00c2ff', '#7dffd4'],
    ['#1a1200', '#2e1a00', '#ffb300', '#ff5e00', '#ffd966'],
    ['#10001f', '#05000d', '#c200ff', '#00f0ff', '#f0b3ff'],
    ['#000000', '#1a0010', '#ffffff', '#ff0066', '#ff0066']
  ],
  // Tunables: key -> [default, min, max, step, label]
  tune: {
    sweet:   [24,  8,  60, 1,    'Sweet spot radius'],
    repel:   [4.5, 0,  14, 0.1,  'Repulsion strength'],
    pull:    [0.35, 0, 2,  0.05, 'Centre pull'],
    up:      [22,  0, 120, 1,    'Upward bias'],
    drift:   [3.0, 0, 10,  0.1,  'Random drift strength'],
    damp:    [1.3, 0.2, 4, 0.05, 'Damping'],
    loss:    [0,   0, 20,  0.1,  'Distance health loss rate (0 = off)'],
    hit:     [5,   0, 40,  0.5,  'Obstacle hit damage'],
    edge:    [4,   1, 15,  0.5,  'Edge damage multiplier'],
    spawn:   [1.0, 0.2, 4, 0.05, 'Obstacle spawn rate'],
    ramp:    [1.0, 0, 3,   0.05, 'Difficulty ramp speed'],
    maxSpeed:[450, 100, 2000, 10, 'Max ball speed (px/s)'],
    bounce:  [0.8, 0.3, 1.2, 0.05, 'Edge bounciness'],
    kick:    [70,  0, 300, 5,    'Edge kick (min inward px/s)']
  }
};
const STORE_BEST = 'scrollgame.best', STORE_TUNE = 'scrollgame.tune2';

// Tunable values (live)
const T = {};
for (const k in CONFIG.tune) T[k] = CONFIG.tune[k][0];
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
(function loadTune() {
  try {
    const s = JSON.parse(lsGet(STORE_TUNE) || '{}');
    for (const k in T) if (typeof s[k] === 'number' && isFinite(s[k])) T[k] = s[k];
  } catch (e) {}
})();

// ============================================================

// Canvas + sizing
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Logical play field. Height 648 with width 450..1152 on landscape frames (fills 16:9), width 450 with height 648..800 on portrait.
// Physics units are the same everywhere; obstacle density is normalised by fieldK() (04-sim.js).
// Render quality steps (canvas resolution multiplier). 99-main.js steps down when frames stay slow; step 2 also drops glows.
const QUALITY = [1, 0.75, 0.58];
const START_Y = 0.42;   // ring/ball start height (fraction of the field)
const REF_W = 450, REF_H = 648, MAX_W = 1152, MAX_H = 800;
let W = REF_W, H = REF_H, DPR = 1, SCALE = 1, RS = 1, PH = REF_H, FH = 0, SAFE = { t: 0, r: 0, b: 0, l: 0 }; // PH = play-area height (footer starts at y=PH); RS = DPR*SCALE
const stageEl = document.getElementById('stage');
function fieldFor(vw, vh) {
  const a = vw / Math.max(1, vh);
  return a >= REF_W / REF_H ? { w: Math.round(clamp(REF_H * a, REF_W, MAX_W)), h: REF_H } : { w: REF_W, h: Math.round(clamp(REF_W / a, REF_H, MAX_H)) };
}
function safeInsets() { // env(safe-area-inset-*) via a probe element (CrazyGames app runs fullscreen under notches)
  try { const cs = getComputedStyle(document.getElementById('safe')); return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 }; } catch (e) { return { t: 0, r: 0, b: 0, l: 0 }; }
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SAFE = safeInsets();
  const vw = Math.max(50, window.innerWidth - SAFE.l - SAFE.r), vh = Math.max(50, window.innerHeight - SAFE.t - SAFE.b);
  const f = fieldFor(vw, vh); W = f.w; H = f.h; PH = H; FH = 0;
  SCALE = Math.min(vw / W, vh / H);
  RS = Math.min(DPR * SCALE, 1920 / W, 1920 / H) * QUALITY[game.q || 0];   // backing store: at most 1920 px on the long side, scaled down further in low-effects modes
  stageEl.style.width = W + 'px'; stageEl.style.height = H + 'px';
  stageEl.style.transform = 'translate(' + (SAFE.l + (vw - W * SCALE) / 2) + 'px,' + (SAFE.t + (vh - H * SCALE) / 2) + 'px) scale(' + SCALE + ')';
  stageEl.style.setProperty('--s', SCALE); stageEl.style.setProperty('--oy', Math.round((H - REF_H) / 2) + 'px'); stageEl.classList.toggle('wide', W > 700);
  canvas.width = Math.round(W * RS); canvas.height = Math.round(H * RS);
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  if (game.target) { game.target.x = clamp(game.target.x, 0, W); game.target.y = clamp(game.target.y, 0, PH); }
  if (game.ball) { game.ball.x = clamp(game.ball.x, game.ball.r, W - game.ball.r); game.ball.y = clamp(game.ball.y, game.ball.r, PH - game.ball.r); }
  if (game.state !== 'play' && game.ball && game.target) { game.target.x = game.ball.x = W / 2; game.target.y = game.ball.y = PH * START_Y; }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

// ============================================================
// Helpers
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);            // cosmetic randomness only
let _seed = (Math.random() * 4294967296) >>> 0;                 // simulation RNG (mulberry32): seedable for deterministic tests
function seedSim(s) { _seed = s >>> 0; }
function srng() { _seed = (_seed + 0x6D2B79F5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const srand = (a, b) => a + srng() * (b - a);
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')';
}
function rgba(h, a) { const c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
// Palette (smoothly interpolated) for a fractional stage value
function palette(stageF) {
  const P = CONFIG.palettes, i = Math.min(P.length - 1, Math.floor(stageF)), j = Math.min(P.length - 1, i + 1);
  const t = clamp(stageF - i, 0, 1), s = t * t * (3 - 2 * t);
  const out = P[i].map((c, n) => mixHex(c, P[j][n], s)).map(rgbToHex);
  const th = typeof selItem === 'function' ? selItem('themes') : null;
  return th && th.fx ? out.map(c => themeColor(c, th.fx)) : out;
}
// Background themes (cosmetic): fx = [hue shift in degrees, saturation multiplier] applied to every stage palette
function themeColor(hex, fx) {
  const m = hex2rgb(hex).map(v => v / 255), mx = Math.max(...m), mn = Math.min(...m), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d > 1e-6) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === m[0] ? ((m[1] - m[2]) / d) % 6 : mx === m[1] ? (m[2] - m[0]) / d + 2 : (m[0] - m[1]) / d + 4; h *= 60; }
  h = ((h + fx[0]) % 360 + 360) % 360; s = clamp(s * fx[1], 0, 1);
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), k = l - c / 2, r = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return '#' + r.map(v => Math.round((v + k) * 255).toString(16).padStart(2, '0')).join('');
}
function rgbToHex(s) {
  const m = s.match(/\d+/g).map(Number);
  return '#' + m.map(v => v.toString(16).padStart(2, '0')).join('');
}

// ============================================================
// Game state
// ============================================================
const game = {
  state: 'start',            // start | play | over
  q: 0, lowFx: false, paused: false, resumeT: 0,  // visibility/panel pause; resumeT > 0 = 3-2-1 countdown before play continues
  t: 0,                      // survival time
  health: CONFIG.startHealth, maxHealth: CONFIG.startHealth, runSum: null,
  best: parseFloat(lsGet(STORE_BEST)) || 0,
  newBest: false,
  ball: null, target: null, obstacles: [], trailSt: null, unlockedNow: [], dirX: 0, dirY: -1,
  drift: { x: 0, y: 0, tx: 0, ty: 0, timer: 0 },
  spawnTimer: 1.5,
  shake: 0, flash: 0, edgeTouch: false,
  overAt: 0, acc: 0,
  bgT: 0, bgOff: { x: 0, y: 0 }, blobs: [],
  stats: { nearMiss: 0, bonusShards: 0, sweetTime: 0, hits: 0, stageMax: 0, milestones: 0 },
  shield: 0, safeUntil: 0, hold: false, holdT: 0, holdMove: 0, hitStop: 0, slowMo: 0,     // frame-time seconds (cosmetic pacing; never affects sim results)
  reduceMotion: lsGet('scrollgame.rm') === '1',
  tutorial: '', tutSpawnAt: -1, breatherUntil: 0, stageSeen: 0, bestPassed: false, prevBest: 0, msDone: 0,
  mouseGoal: null, tutRun: false
};
game.stageName = () => CONFIG.stageNames[Math.min(7, Math.floor(game.stageF()))];
game.stageF = () => game.state === 'play' || game.state === 'over' ? diffTime() / CONFIG.stageSeconds : 0.0;
// Effective "difficulty time" (seconds scaled by ramp speed)
// First-run easing: runs 1-2 ramp slower so new players reach the 60s mark
function easeF() { const r = typeof prog !== 'undefined' ? prog.runs : 9; return r < 1 ? 0.6 : r < 2 ? 0.75 : r < 4 ? 0.9 : 1; }
function diffTime() { return game.t * T.ramp * easeF(); }
// Difficulty level: 0 at start, ~1 at 60s with ramp 1
function level() { return diffTime() / 60; }

function initBlobs() {
  game.blobs = [];
  for (let i = 0; i < 7; i++) game.blobs.push({ x: Math.random(), y: Math.random(), r: rand(0.25, 0.6),
    vx: rand(-0.02, 0.02), vy: rand(-0.02, 0.02), c: i % 2 });
}
initBlobs();

function resetRun() {
  game.pw = newPw(); game.pwUsed = 0; MOD.sweetTemp = 0; MOD.calm = 1; game.t = 0; game.maxHealth = CONFIG.startHealth * MOD.hp; game.health = game.maxHealth; game.newBest = false;
  game.stats = { nearMiss: 0, bonusShards: 0, sweetTime: 0, hits: 0, stageMax: 0, milestones: 0 };
  game.shield = typeof prog !== 'undefined' && prog.runs < SHIELD_RUNS ? 1 : 0; game.safeUntil = 0; game.hold = true; game.holdT = 0; game.holdMove = 0; game.hitStop = 0; game.slowMo = 0; game.tutorial = ''; game.tutSpawnAt = -1; game.breatherUntil = 0; game.stageSeen = 0;
  game.bestPassed = false; game.prevBest = game.best; game.msDone = 0; game.mouseGoal = null; game.tutRun = typeof prog !== 'undefined' && prog.runs === 0;
  game.obstacles = []; game.trailSt = newTrailSt(); game.unlockedNow = []; game.spawnTimer = 1.5;
  game.shake = 0; game.flash = 0; game.acc = 0;
  game.paused = false; game.resumeT = 0;
  game.target = { x: W / 2, y: PH * START_Y };
  game.ball = { x: W / 2, y: PH * START_Y, vx: 0, vy: 0, r: CONFIG.ballRadius };
  game.drift = { x: 0, y: 0, tx: 0, ty: 0, timer: 0 };
}
function fxe(type, data) { if (typeof fxEvent === 'function') fxEvent(type, data || {}); }
function startRun() {
  meta.notice = []; meta.pending = null; telRunStart(); resetRun(); game.state = 'play'; telBegin(); PLATFORM.gameplayStart(); Audio_.sfx('start'); Audio_.music(true);
  fxe('start');
}
function endRun() {
  fxe('death', { x: game.ball ? game.ball.x : 0, y: game.ball ? game.ball.y : 0 });
  game.tutorial = ''; game.hitStop = 0;
  game.state = 'over'; game.overAt = performance.now(); PLATFORM.gameplayStop(); Audio_.music(false); Audio_.sfx('over');
  const s = game.t;
  if (s > game.best) { game.best = s; game.newBest = true; lsSet(STORE_BEST, String(s)); }
  game.unlockedNow = recordRun(s); game.runSum = metaOnRunEnd(s, game.newBest); if (game.unlockedNow.length || game.runSum.lines.length) setTimeout(() => Audio_.sfx('unlock'), 500);
  telEnd();
}


// ============================================================
// Input (relative drag)
// ============================================================
let drag = null; // {id, x, y}
function onDown(e) {
  if (e.target !== canvas) return;
  e.preventDefault();
  Audio_.unlock(); telTouch(); lastPtr = e.pointerType === 'touch' ? 'touch' : 'mouse';
  if (panelOpen || collOpen) return;
  if (game.paused) { resumeGame(); return; }
  if (game.state === 'start') { startRun(); }
  else if (game.state === 'over') {
    if (performance.now() - game.overAt > 300) startRun(); else return;
  }
  if (e.pointerType === 'mouse') mouseFollow(e);
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };

function update(frameDt) {

  g.bgOff.y += (14 + Math.sin(g.bgT * 0.11) * 10) * frameDt * (1 + sf);
  for (const bl of g.blobs) {
    bl.x += bl.vx * frameDt * (1 + sf); bl.y += bl.vy * frameDt * (1 + sf);
    if (bl.x < -0.2 || bl.x > 1.2) bl.vx *= -1;
    if (bl.y < -0.2 || bl.y > 1.2) bl.vy *= -1;
  }

    { const kd = kbDir(); if (kd.x || kd.y) g.mouseGoal = null; }
    if (g.mouseGoal && g.target) { // desktop mouse-follow: ring chases the cursor at a capped speed
      const mx = g.mouseGoal.x - g.target.x, my = g.mouseGoal.y - g.target.y, md = Math.hypot(mx, my), mv = Math.min(md, 1600 * frameDt);

    }

    else if (g.slowMo > 0) { g.slowMo -= frameDt; ft = frameDt * 0.35; }

// ---- Trails: state is {pts, parts}; one code path for the game and the previews ----
function newTrailSt() { return { pts: [], parts: [], acc: 0 }; }
function trailUpdate(st, id, x, y, dt, active) {
  for (const p of st.pts) p.age += dt;
  while (st.pts.length && st.pts[0].age > TRAIL_LIFE) st.pts.shift();
  if (active) st.pts.push({ x, y, age: 0 });
  if (active && id === 'sparks') {
    for (let i = 0; i < 2; i++) st.parts.push({ x, y, vx: rand(-70, 70), vy: rand(-70, 70), life: 0, max: rand(0.35, 0.7), sz: rand(0.6, 1.4) });
  } else if (active && id === 'bubbles') {
    st.acc += dt;
    while (st.acc > 0.07) { st.acc -= 0.07; st.parts.push({ x: x + rand(-6, 6), y: y + rand(-6, 6), vx: rand(-10, 10), vy: rand(-45, -15), life: 0, max: rand(0.8, 1.4), sz: rand(0.2, 0.42) }); }
  } else if (active && id === 'stars') {
    st.acc += dt;
    while (st.acc > 0.06) { st.acc -= 0.06; st.parts.push({ x: x + rand(-6, 6), y: y + rand(-6, 6), vx: rand(-25, 25), vy: rand(-30, 10), life: 0, max: rand(0.6, 1.1), sz: rand(0.35, 0.6), ph: rand(0, 6.28) }); }
  } else if (active && id === 'echo') {
    st.acc += dt;
    while (st.acc > 0.1) { st.acc -= 0.1; st.parts.push({ x, y, vx: 0, vy: 0, life: 0, max: 0.55, sz: 1 }); }
  }
  for (let i = st.parts.length - 1; i >= 0; i--) {
    const p = st.parts[i]; p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life > p.max) st.parts.splice(i, 1);
  }
  if (id !== 'sparks' && id !== 'bubbles' && id !== 'stars' && id !== 'echo') st.parts.length = 0;
}
function trailDraw(c, st, id, r, col) {
  if (id === 'none') return;
  const pts = st.pts;
  c.save();
  if (id === 'classic') {
    for (const p of pts) {
      const a = 1 - p.age / TRAIL_LIFE; if (a < 0.03) continue;
      c.fillStyle = rgba('#ffffff', a * a * 0.35); circ(c, p.x, p.y, r * (0.4 + 0.5 * a)); c.fill();
    }
  } else if (id === 'rainbow') {
    const base = performance.now() / 4;
    for (const p of pts) {
      const a = 1 - p.age / TRAIL_LIFE;
      c.fillStyle = 'hsla(' + ((base - p.age * 500) % 360) + ',100%,62%,' + (a * 0.7) + ')'; circ(c, p.x, p.y, r * (0.3 + 0.55 * a)); c.fill();
    }
  } else if (id === 'ribbon') {
    c.lineCap = 'round'; c.shadowColor = col; c.shadowBlur = 10;
    for (let i = 1; i < pts.length; i++) {

function fxUpdate(dt) {
  const g = game;

  if (fx.hpShown > hp) fx.hpShown = Math.max(hp, fx.hpShown - dt * 0.7); else fx.hpShown = hp;

  fx.bezel += dt * (0.25 + 0.45 * L);

    if (p.life <= 0) continue;
    const pd = dt * slow;
    p.life -= pd; p.vy += p.g * pd; p.x += p.vx * pd; p.y += p.vy * pd;
    if (p.k !== 1) { const f = Math.exp(-pd * 2.2); p.vx *= f; if (!p.g) p.vy *= f; }

  for (let i = fx.pops.length - 1; i >= 0; i--) { fx.pops[i].t += dt; if (fx.pops[i].t > fx.pops[i].max) fx.pops.splice(i, 1); }
  for (let i = fx.cracks.length - 1; i >= 0; i--) { fx.cracks[i].t += dt; if (fx.cracks[i].t > fx.cracks[i].max) fx.cracks.splice(i, 1); }

  if (g.state === 'play' && typeof runShards === 'function') {

    if (s > fx.lastShards) {
      fx.shardPulse = 1;
      if (g.ball && s % 4 === 0) fxPop(g.ball.x, g.ball.y - 24, '+1 ◆', '#ffd84d', 15, 0.8);
      fx.lastShards = s;

  }
}

// Particles, drawn in world (shaken) space
function fxDrawWorld(c) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (const p of fx.pool) {
    if (p.life <= 0 || p.k !== 0) continue;
    const a = clamp(p.life / p.max, 0, 1);
    c.globalAlpha = a; c.fillStyle = p.c;

    if (p.life <= 0 || p.k === 0) continue;

const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

const meta = Object.assign({ v: 1, shards: 0, xp: 0, upg: {}, streak: 0, lastDay: '', day: '', q: { runs: 0, best: 0, shards: 0, time: 0, done: {} }, pending: null, notice: [] },

const upgLvl = u => meta.upg[u.id] || 0;

const playerLvl = () => lvlInfo(meta.xp).lvl;
function todaysQuests() {

// Add xp; returns shard reward for any level-ups
function addXp(n) { const before = playerLvl(); meta.xp += n; let reward = 0, lv = playerLvl(); for (let l = before; l < lv; l++) reward += 20 + 5 * (l + 1); return { reward, lvl: lv, up: lv > before }; }

(function dailyOpen() { // new day: streak + bonus, fresh quests; bank any interrupted run

/* 10-audio.js: procedural WebAudio (SFX blips + synthwave loop). No audio assets. */
const Audio_ = (() => {
  const MUTE_KEY = 'scrollgame.mute';
  const SIX = 60 / 124 / 4;            // one 16th note at 124 BPM (s)
  const LOOK = 0.15, TICK = 25;        // scheduler lookahead (s) and interval (ms)
  // [bass root Hz, semitone arpeggio] per bar: Am, F, C, G
  const CHORDS = [
    [110.0, [0, 3, 7, 12]], [87.31, [0, 4, 7, 12]],
    [130.81, [0, 4, 7, 12]], [98.0, [0, 4, 7, 12]]
  ];
  const DIV = [4, 2, 2, 1];            // arp note every N sixteenths, by intensity
  const CUT = [900, 1300, 1800, 2600]; // lowpass cutoff by intensity
  const MASTER = 0.8, MUSIC = 0.9;       // mix: music sits about 8 dB under the SFX peaks and ducks on hits
  const SFX_GAIN = { buy: 1.7, power: 1.5, levelUp: 1.5, stage: 1.5, unlock: 1.3, edge: 0.8, milestone: 1.2, hit: 0.9 };   // levelled from measured peaks (see docs/play-review.md)
  const DUCK = { hit: 0.45, over: 0.3, newBest: 0.5, stage: 0.6 };   // music level while these play
  const MIN_GAP = { edge: 80, hit: 80, nearMiss: 120, tick: 30 };

  let ctx = null, master = null, bus = null, lp = null, noise = null;
  let timer = null, nextT = 0, step = 0, intensity = 0;
  let wanted = false, paused = false, unlocked = false, muted = false;
  const lastAt = {};
  try { muted = lsGet(MUTE_KEY) === '1'; } catch (e) {}

  // Lazily build the AudioContext and graph; returns null if WebAudio is missing.
  function ensure() {
    if (ctx) return ctx;

      const AC = window.AudioContext || window.webkitAudioContext;

      comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.12;
      master.connect(comp); comp.connect(c.destination);

    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  // Short filtered noise tick for hi-hats.
  function hat(t, vol) {

  function playStep(s, t) {

    if (L8 >= 4 && s % 8 === 4) { hat(t, 0.11); voice(bus, 'triangle', 190, 120, t, 0.003, 0.08, 0.12); }
    if (L8 >= 5 && s % 8 === 0) voice(bus, 'sine', ch[0] / 2, 0, t, 0.01, SIX * 7, 0.22);
    if (L8 >= 6 && s % 4 === 0) voice(bus, 'square', ch[0] * 4 * Math.pow(2, (ch[1][(s >> 2) % 4] + 7) / 12), 0, t + SIX, 0.003, SIX * 1.2, 0.022);
    if (L8 >= 7 && s % 2 === 0) hat(t, 0.035);

      const k = (s / div) % 4;
      voice(bus, 'sawtooth', ch[0] * Math.pow(2, ch[1][k] / 12), 0, t, 0.005, div * SIX * 0.9, 0.12);

  // Lookahead scheduler: queues steps up to LOOK seconds ahead.

  function setMuted(v) {

  // Filtered noise burst (crackle / crunch), uses a cached 0.25 s buffer.

  // Sound effects: each takes (output node, start time).
  const SFX = {
    start:  (o, t) => { voice(o, 'sawtooth', 220, 880, t, 0.01, 0.25, 0.2); voice(o, 'square', 440, 1320, t + 0.12, 0.01, 0.2, 0.08); },
    go:     (o, t) => { voice(o, 'square', 660, 0, t, 0.004, 0.09, 0.1); voice(o, 'square', 990, 0, t + 0.08, 0.004, 0.16, 0.12); },
    hit:    (o, t) => { voice(o, 'square', 180, 60, t, 0.005, 0.12, 0.25); voice(o, 'sine', 110, 38, t, 0.004, 0.22, 0.45); burst(o, t, 0.08, 1800, 0.8, 0.18); }, // + low thud
    edge:   (o, t) => { voice(o, 'triangle', 1200, 900, t, 0.003, 0.05, 0.15); burst(o, t, 0.1, 5200, 1.5, 0.22); burst(o, t + 0.03, 0.07, 3400, 2, 0.14); }, // + crackle
    over:   (o, t) => { voice(o, 'sawtooth', 440, 55, t, 0.01, 0.35, 0.3); voice(o, 'triangle', 330, 110, t + 0.12, 0.01, 0.22, 0.15); },
    unlock: (o, t) => [523.25, 659.25, 783.99].forEach((f, i) => voice(o, 'sine', f, 0, t + i * 0.06, 0.005, 0.12, 0.2)),
    buy:    (o, t) => { voice(o, 'square', 660, 0, t, 0.005, 0.1, 0.12); voice(o, 'square', 990, 0, t + 0.07, 0.005, 0.14, 0.12); },
    power:  (o, t) => voice(o, 'sawtooth', 300, 1500, t, 0.02, 0.3, 0.18),
    tick:   (o, t) => voice(o, 'sine', 1800, 0, t, 0.002, 0.03, 0.15),
    nearMiss: (o, t) => { voice(o, 'sine', 900, 1500, t, 0.004, 0.09, 0.2); voice(o, 'sine', 1500, 2200, t + 0.06, 0.004, 0.1, 0.14); },
    stage:  (o, t) => {
      voice(o, 'sawtooth', 140, 700, t, 0.02, 0.5, 0.14);
      [392, 523.25, 659.25, 783.99].forEach((f, i) => voice(o, 'square', f, 0, t + 0.12 + i * 0.08, 0.005, 0.18, 0.1));
    },
    newBest: (o, t) => {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => { voice(o, 'square', f, 0, t + i * 0.09, 0.005, 0.22, 0.13); voice(o, 'sine', f * 2, 0, t + i * 0.09, 0.005, 0.3, 0.08); });

    milestone: (o, t) => [659.25, 880, 1174.66].forEach((f, i) => voice(o, 'sine', f, 0, t + i * 0.07, 0.004, 0.2, 0.2)),
    levelUp: (o, t) => {
      [392, 493.88, 587.33, 783.99, 987.77, 1174.66].forEach((f, i) => voice(o, 'square', f, 0, t + i * 0.07, 0.005, 0.2, 0.1));

    // Call from any pointerdown/keydown. Safe to repeat.
    unlock() {

        if (!unlocked) { // iOS: play a silent buffer inside the gesture

    sfx(name) {

    resume() {
      paused = false;

        const p = ctx.resume();
        if (p && p.then) p.then(syncMusic, () => {});
      } catch (e) {}

    }
  };
})();

// Wordmark: NEON (small, magenta) over BULLSEYE (large, cyan), fitted to the field width. Also used by the store covers.
function drawWordmark(cx, y, maxW) {
  ctx.save();
  ctx.font = '56px ' + FONT_DISPLAY; const w = ctx.measureText('BULLSEYE').width || 300, k = Math.min(1, maxW / w), sz = 56 * k;
  textAt('NEON', cx, y - sz * 0.78, Math.max(18, sz * 0.42), '#ff4de0', 16, { font: 'display', ls: sz * 0.5 });
  textAt('BULLSEYE', cx, y, sz, '#3ef0ff', 26, { font: 'display' });
  ctx.restore();
}

// ---- title ----
function drawTitle(pal) {
  const g = game, now = performance.now() / 1000, cy = PH * START_Y, cx = W / 2, kind = inputKind();
  drawWordmark(cx, cy - 122, Math.min(W - 70, 420));
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(now * 3.5);
  scrText(kind === 'touch' ? 'TAP TO PLAY' : kind === 'key' ? 'PRESS SPACE' : 'CLICK TO PLAY', cy + 126, 27, '#ffee66', 14, { font: 'display' });
  ctx.globalAlpha = 1;
  scrText('Keep the ball in the ring' + (kind === 'touch' ? '' : '  ·  mouse, arrows or WASD'), cy + 156, 15, '#cfe6f5', 0);
  let y = cy + 196;
  if (prog.runs > 0) { // returning player: best + level
    const li = lvlInfo(meta.xp);
    textAt('BEST ' + fmtTime(g.best) + 's', cx - 16, y, 18, '#ffffff', 6, { font: 'display', align: 'right' });
    textAt('LEVEL ' + li.lvl, cx + 16, y, 18, C_UI, 6, { font: 'display', align: 'left' });
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(cx + 16, y + 14, 86, 3); ctx.fillStyle = C_UI; ctx.fillRect(cx + 16, y + 14, 86 * li.into / li.need, 3);
    y += 42;
  }
  // Missions: always a named target for the next run
  const x0 = cx - 158;
  for (const m of MISSIONS) {
    const c = missionNow(m); if (!c) continue;
    scrShard(x0 + 5, y, 6);
    textAt(c.text, x0 + 18, y, 15, '#e6f6ff', 0, { align: 'left' });
    const f = clamp(c.v / c.target, 0, 1); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(cx + 62, y - 2, 50, 4); ctx.fillStyle = C_SHARD; ctx.fillRect(cx + 62, y - 2, 50 * f, 4);
    textAt('+' + c.reward, x0 + 316, y, 15, C_SHARD, 0, { align: 'right' });
    y += 25;
  }
  meta.notice.slice(0, 2).forEach((n, i) => scrText(n, y + 8 + i * 22, 14, C_SHARD, 4));
}

// ---- first-run tutorial: one animated control glyph + three words, matched to the input in use ----
function drawTutorial() {
  const g = game, tut = g.tutorial; if (!tut || g.state !== 'play' || g.paused) return;
  const kind = inputKind(), t = fx.t, cx = W / 2, y = Math.min(PH - 62, Math.max(g.target.y + 150, PH * 0.74));
  const head = tut === 'move' ? 'MOVE THE RING' : tut === 'centre' ? 'KEEP THE BALL CENTRED' : 'DODGE THE SHAPES';
  const sub = tut === 'move' ? (kind === 'touch' ? 'Drag anywhere' : kind === 'key' ? 'Arrow keys or WASD' : 'Move your mouse')
    : tut === 'centre' ? 'It gets pushed away when it leaves the middle' : 'Hits break the ring';
  ctx.save();
  if (tut === 'move') {
    const iy = y - 50, sway = Math.sin(t * 3) * 24; ctx.strokeStyle = '#dffcff'; ctx.fillStyle = '#dffcff'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; glow('#6ff', 8);
    if (kind === 'key') {
      const on = Math.floor(t * 2) % 4, K = [[0, -30, -1.571], [-32, 0, 3.1416], [0, 0, 1.571], [32, 0, 0]];
      K.forEach((k, i) => { ctx.globalAlpha = i === on ? 1 : 0.5; scrRR(cx + k[0] - 13, iy + k[1] - 13 + 8, 26, 26, 6); ctx.stroke();
        ctx.save(); ctx.translate(cx + k[0], iy + k[1] + 8); ctx.rotate(k[2]); ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, -5); ctx.lineTo(-3, 5); ctx.closePath(); ctx.fill(); ctx.restore(); });
    } else if (kind === 'touch') {
      ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(cx + sway, iy, 11, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(cx + sway, iy, 19, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.moveTo(cx - 34, iy); ctx.lineTo(cx + 34, iy); ctx.stroke();
    } else {
      ctx.globalAlpha = 0.95; scrRR(cx + sway - 12, iy - 18, 24, 36, 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx + sway, iy - 11); ctx.lineTo(cx + sway, iy - 3); ctx.stroke();
      ctx.globalAlpha = 0.5; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + d * 44, iy - 6); ctx.lineTo(cx + d * 52, iy); ctx.lineTo(cx + d * 44, iy + 6); ctx.stroke(); }
    }
    noGlow(); ctx.globalAlpha = 1;
  }
  const wT = 0.75 + 0.25 * Math.sin(t * 4);
  ctx.fillStyle = 'rgba(3,1,9,0.5)'; scrRR(cx - 190, y - 20, 380, 62, 14); ctx.fill();
  textAt(head, cx, y, 21, '#eaffff', 10, { font: 'display', alpha: wT });
  textAt(sub, cx, y + 26, 15, '#cfe6f5', 0);
  ctx.restore();
}

// ---- game over: result, how far you got, what you earned, what to go for next. Retry is never blocked. ----
function scrGoalLine() { const gi = metaGoalInfo(); return gi && !gi.afford ? gi : null; }
function drawGameOver(pal) {
  const g = game, rs = g.runSum, el = performance.now() - g.overAt, cx = W / 2, oy = (H - REF_H) / 2;
  if (SCR.goKey !== g.overAt) { SCR.goKey = g.overAt; SCR.lastShown = -1; SCR.lvlSfx = false; }
  const a = clamp((el - 450) / 300, 0, 1);      // death animation plays first; summary fades in
  if (a <= 0) return;
  ctx.fillStyle = 'rgba(3,1,9,' + (0.86 * a) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  monoText(fmtTime(g.t), cx - 14, oy + 104, 76, '#ffffff', 18);
  ctx.font = '76px ' + FONT_DISPLAY; const tw = (fmtTime(g.t).length - 0.5) * (+ctx.measureText('0').width || 50);
  textAt('S', cx - 14 + tw / 2 + 20, oy + 118, 28, '#ffffff', 8, { font: 'display', alpha: 0.7 });
  const gap = Math.max(0, g.best - g.t);
  if (g.newBest) scrText('NEW BEST!', oy + 160, 26, '#ffee00', 18, { font: 'display', alpha: 0.75 + 0.25 * Math.sin(performance.now() / 150) });
  else if (gap <= 3) scrText('SO CLOSE!  ' + fmtTime(gap) + 's OFF YOUR BEST', oy + 160, 18, '#ffee66', 10, { font: 'display' });
  else scrText('BEST ' + fmtTime(g.best) + 's', oy + 160, 17, C_DIM, 0, { font: 'display' });
  // stage strip
  const names = scrNames(), idx = scrStageIdx(), sx = cx - 140, sy = oy + 204;
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 280, sy); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const x = sx + i * 40, col = palette(i)[2], on = i <= idx;
    ctx.beginPath(); ctx.arc(x, sy, i === idx ? 9 : 6, 0, 6.283);
    if (on) { ctx.save(); glow(col, i === idx ? 14 : 6); ctx.fillStyle = col; ctx.fill(); ctx.restore(); }
    else { ctx.fillStyle = '#0b0920'; ctx.fill(); ctx.strokeStyle = i === idx + 1 ? col : 'rgba(255,255,255,0.3)'; ctx.lineWidth = i === idx + 1 ? 2 : 1.5; ctx.stroke(); }
  }
  scrText('STAGE ' + (idx + 1) + ' · ' + names[idx] + (idx < 7 ? '      NEXT: ' + names[idx + 1] : ''), sy + 27, 14, '#dff', 0, { font: 'display', alpha: 0.9 });
  // shards earned (counts up)
  let shards = 0;
  if (rs) {
    const u = clamp((el - 750) / 900, 0, 1), e = 1 - Math.pow(1 - u, 3); shards = Math.round(rs.shards * e);
    if (shards !== SCR.lastShown) { SCR.lastShown = shards; if (performance.now() - SCR.tickAt > 45 && u < 1 && typeof Audio_ !== 'undefined') { SCR.tickAt = performance.now(); Audio_.sfx('tick'); } }
  }
  ctx.font = '30px ' + FONT_DISPLAY; const sw = ctx.measureText('+' + shards).width;
  textAt('+' + shards, cx + 12, oy + 278, 30, C_SHARD, 10, { font: 'display' }); scrShard(cx - sw / 2 - 6, oy + 277, 10);
  // what happened: every unlock, level-up, mission and quest (up to three lines)
  const hl = [];
  for (const n of g.unlockedNow) hl.push(['UNLOCKED: ' + n, C_GOOD]);
  if (rs) { if (rs.up) hl.push(['LEVEL UP! LEVEL ' + rs.lvl, C_UI]); for (const l of rs.lines) if (!/^Level/.test(l[0])) hl.push([l[0].replace(/^(Mission|Quest): /, '$1 done: '), C_SHARD]); }
  if (hl.length > 3) { const more = hl.length - 2; hl.length = 2; hl.push(['+ ' + more + ' more rewards', C_DIM]); }
  if (hl.length && el > 1500) {
    if (!SCR.lvlSfx) { SCR.lvlSfx = true; if (typeof Audio_ !== 'undefined' && rs && rs.up && !g.unlockedNow.length) Audio_.sfx('levelUp'); }
    hl.forEach((h, i) => { const k = clamp((el - 1500 - i * 160) / 200, 0, 1); if (k > 0) textAt(h[0], cx, oy + 322 + i * 25 + (1 - k) * 6, 15, h[1], 6, { font: i < g.unlockedNow.length || /LEVEL UP/.test(h[0]) ? 'display' : 'ui', alpha: k }); });
  }
  // next goal: progress towards the cheapest upgrade (the UPGRADE button replaces this when it is affordable)
  const gl = scrGoalLine();
  if (gl) {
    scrText('Next upgrade: ' + gl.u.name + '  ·  ' + Math.floor(meta.shards) + ' / ' + gl.c, oy + 440, 14, '#e6f6ff', 0);
    scrBar(oy + 456, 240, 6, gl.frac, C_SHARD);
  }
  scrText(inputKind() === 'touch' ? 'or tap anywhere' : 'Space, Enter or click anywhere', oy + 586, 13, C_DIM, 0);
  ctx.globalAlpha = 1;
}

function drawOverlayScreens(pal) {
  const g = game;
  if (g.state === 'start') drawTitle(pal);
  else if (g.state === 'over') drawGameOver(pal);
  else drawTutorial();
  if (g.paused && g.state === 'play' && !panelOpen) {
    ctx.fillStyle = 'rgba(3,1,9,0.62)'; ctx.fillRect(0, 0, W, H);
    if (g.resumeT > 0) scrText(String(Math.max(1, Math.ceil(g.resumeT / (RESUME_S / 3)))), H * 0.42, 84, '#fff', 20, { font: 'display' });
    else {
      scrText('PAUSED', H * 0.4, 44, '#fff', 14, { font: 'display' });
      const k = inputKind();
      scrText(k === 'touch' ? 'Tap to resume' : k === 'key' ? 'Press any key to resume' : 'Click or press any key to resume', H * 0.4 + 46, 17, '#cfe6f5', 0);
    }
  }
}

// ============================================================
// DOM chrome
// ============================================================
const railEls = { shop: scrEl('rShop'), col: scrEl('rCol'), daily: scrEl('rDaily'), set: scrEl('rSet'), pause: scrEl('rPause') };
const dotOf = b => b.querySelector('.dot');
for (const id of ['rShop', 'goUp', 'rCol', 'rDaily', 'rSet', 'rPause', 'retry', 'setRm', 'setLefty', 'setClose', 'stOk']) {
  const b = scrEl(id); for (const ev of ['pointerdown', 'pointerup', 'touchstart', 'mousedown']) b.addEventListener(ev, e => e.stopPropagation());
}
railEls.shop.addEventListener('click', () => { Audio_.unlock(); openCollTab('upgrades'); });
scrEl('goUp').addEventListener('click', () => { Audio_.unlock(); openCollTab('upgrades'); });
railEls.col.addEventListener('click', () => { Audio_.unlock(); openCollTab('balls'); });
railEls.daily.addEventListener('click', () => { Audio_.unlock(); openCollTab('daily'); });
railEls.set.addEventListener('click', () => openSettings(true));
railEls.pause.addEventListener('click', () => { if (game.state === 'play' && !game.paused) autoPause(); });
scrEl('retry').addEventListener('click', () => { Audio_.unlock(); if (game.state === 'over' && performance.now() - game.overAt > 300) startRun(); });

// settings sheet
function openSettings(on) { SCR.settingsOpen = on; scrEl('settings').classList.toggle('open', on); if (on) syncSettings(); }
function syncSettings() { scrEl('setRm').textContent = game.reduceMotion ? 'ON' : 'OFF'; scrEl('setLefty').textContent = meta.lefty ? 'ON' : 'OFF'; }
scrEl('setRm').addEventListener('click', () => { setReduceMotion(!game.reduceMotion); syncSettings(); });
scrEl('setLefty').addEventListener('click', () => { meta.lefty = !meta.lefty; metaSave(); syncSettings(); });
scrEl('setClose').addEventListener('click', () => openSettings(false));

// daily streak card: once per day on first open
function openStreak(on) { SCR.streakOpen = on; scrEl('streak').classList.toggle('open', on); }
scrEl('stOk').addEventListener('click', () => openStreak(false));
scrEl('streak').addEventListener('click', e => { if (e.target === scrEl('streak')) openStreak(false); });
function checkStreakCard() {
  SCR.streakChecked = true;
  const today = dayKey(new Date());
  if (prog.runs < 1) { lsSet(STORE_STREAK, today); meta.notice = meta.notice.filter(n => !/^Daily bonus/.test(n)); return; } // first session is play only: no card, no bonus line
  if (meta.lastDay !== today || lsGet(STORE_STREAK) === today) return;
  lsSet(STORE_STREAK, today);
  scrEl('stDays').innerHTML = streakHTML();
  scrEl('stTxt').textContent = 'Day ' + meta.streak + ' streak: +' + DAILY[(meta.streak - 1) % 7] + ' shards. Day 7: +' + DAILY[6] + ' and the Royal ball.';
  openStreak(true);
}
// keep Space/Enter/arrows from starting a run while a sheet is open
window.addEventListener('keydown', e => {
  if (!SCR.settingsOpen && !SCR.streakOpen) return;
  e.stopPropagation();
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (SCR.streakOpen) openStreak(false); else openSettings(false); }
}, true);

function anyUpgradeAffordable() {
  for (const u of UPG) { const l = upgLvl(u); if (l < u.max && meta.shards >= upgCost(u, l)) return true; }
  for (const d of PWS) if (!meta.pw[d.id] && meta.shards >= d.cost) return true;
  return false;
}
// Called every frame (99-main): only touches the DOM when something changed
function syncScreens() {
  const g = game, st = g.state;
  if (st !== SCR.st) { SCR.st = st; stageEl.dataset.st = st; }
  if (!SCR.streakChecked && st === 'start') checkStreakCard();
  if (SCR.streakOpen && st !== 'start') openStreak(false);
  const el = performance.now() - g.overAt, gi = metaGoalInfo();
  const showGo = st === 'over' && el > 450 && !collOpen && !SCR.settingsOpen;
  if (st === 'play') SCR.seen = true;
  const up = showGo && gi && gi.afford;
  const sig = [showGo, up, gi ? gi.u.id + gi.c : '', anyUpgradeAffordable(), dailyDone() > (meta.dq || 0)].join();
  if (sig === SCR.sig) return; SCR.sig = sig;
  scrEl('retry').classList.toggle('show', showGo);
  const gb = scrEl('goUp'); gb.classList.toggle('show', !!up); if (up) gb.textContent = 'UPGRADE READY: ' + gi.u.name.toUpperCase() + '  \u25c6 ' + gi.c;
  dotOf(railEls.shop).classList.toggle('on', anyUpgradeAffordable());
  dotOf(railEls.daily).classList.toggle('on', dailyDone() > (meta.dq || 0));
}

// Dev-only UI is removed from the DOM entirely in builds without devUI
if (!BUILD.devUI) ['gear', 'panel'].forEach(i => { const n = document.getElementById(i); if (n && n.parentNode) n.parentNode.removeChild(n); });
// Non-blocking first-run privacy notice
(function () {
  const el = document.getElementById('priv'), ok = document.getElementById('privOk');
  if (!BUILD.telemetry || !el || lsGet('scrollgame.priv') === '1') { if (el) el.remove(); return; }
  el.style.display = 'block';
  const close = () => { lsSet('scrollgame.priv', '1'); el.remove(); };
  ok.addEventListener('click', close); setTimeout(() => { if (el.parentNode) close(); }, 20000);
})();
// iOS: resume audio inside a click/touchend gesture too
['touchend', 'click'].forEach(ev => document.addEventListener(ev, () => Audio_.unlock(), { capture: true, passive: true }));
// Main loop
// ============================================================
let last = performance.now(), _ema = 16, _slow = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, CONFIG.maxFrame); last = now;
  // Adaptive quality: if frames stay slow (EMA > 21 ms for ~1.5 s of play), step the render resolution down; step 2 also drops glows
  if (game.state === 'play' && !game.paused && dt < 0.1) { _ema += (dt * 1000 - _ema) * 0.05; if (_ema > 21) { if ((_slow += dt) > 1.5 && game.q < QUALITY.length - 1) { game.q++; game.lowFx = game.q >= 2; _slow = 0; _ema = 16; resize(); } } else _slow = 0; }
  update(dt); render(); syncPw(); syncScreens();
  requestAnimationFrame(frame);
}
resize();
resetRun();
window.__TEST_HOOKS = { meta, usePw, render, update, game, T, area: () => ({ W, H, PH, FH }), prog, tel: { get queue() { return tq; }, get pending() { return pending; }, get rs() { return rs; }, get sent() { return tsent; }, flush } }; // test-only hook (Playwright)
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

</script>
</body>
</html>
