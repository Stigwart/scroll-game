<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bullseye</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05030d; overflow:hidden;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: "Trebuchet MS", system-ui, sans-serif; color:#dff; }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #gear { position:absolute; top:max(10px, 0px); right:10px; width:42px; height:42px;
    border-radius:50%; border:1px solid #6ff8; background:#0a1020cc; color:#8ff; font-size:22px;
    line-height:40px; text-align:center; padding:0; cursor:pointer; z-index:5; box-shadow:0 0 10px #0ff4; }
  #panel { position:absolute; inset:0; background:#05030dee; z-index:4; display:none; overflow-y:auto;
    padding:60px 18px 24px; box-sizing:border-box; touch-action:pan-y; }
  #panel.open { display:block; }
  #panel h2 { margin:0 0 12px; color:#6ff; letter-spacing:2px; font-size:18px; }
  .row { margin:10px 0; font-size:14px; }
  .row label { display:flex; justify-content:space-between; color:#bdf; }
  .row b { color:#ff6; font-weight:normal; }
  .row input { width:100%; margin:4px 0 0; accent-color:#0ff; }
  #panel button.reset { margin-top:14px; padding:10px 16px; background:#201030; color:#f8f;
    border:1px solid #f8f8; border-radius:6px; font-size:15px; }
  #panel .hint { color:#889; font-size:12px; margin-top:10px; }
  #collBtn { position:absolute; left:50%; transform:translateX(-50%); bottom:52px; /* centred in the 152px action footer */
    min-height:48px; padding:0 26px; border-radius:24px; border:1px solid #6ff; background:#0a1020dd; color:#8ff;
    font:bold 17px/1 "Trebuchet MS", system-ui, sans-serif; letter-spacing:1px; z-index:3; display:none;
    box-shadow:0 0 14px #0ff5; cursor:pointer; }
  #coll { position:absolute; inset:0; z-index:6; background:linear-gradient(#06061a,#14083a); display:none;
    flex-direction:column; padding:max(12px, 0px) 16px 0; box-sizing:border-box; }
  #coll.open { display:flex; }
  .chead { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .chead h2 { margin:0; color:#6ff; letter-spacing:2px; font-size:18px; }
  #collBack { min-height:44px; padding:0 16px; border-radius:10px; border:1px solid #f8f8; background:#201030; color:#f8f;
    font:bold 16px "Trebuchet MS", system-ui, sans-serif; cursor:pointer; }
  #tabs { display:flex; gap:10px; margin-bottom:12px; }
  #tabs button { flex:1; min-height:46px; border-radius:10px; border:1px solid #6ff6; background:#0a1020; color:#9cd;
    font:bold 16px "Trebuchet MS", system-ui, sans-serif; cursor:pointer; }
  #tabs button.on { background:#0e3a4a; color:#fff; border-color:#6ff; box-shadow:0 0 10px #0ff5; }
  #grid { flex:1; overflow-y:auto; touch-action:pan-y; display:grid; grid-template-columns:1fr 1fr; gap:12px;
    align-content:start; grid-auto-rows:min-content; padding-bottom:max(20px, 0px); }
  .tile { min-height:132px; border-radius:14px; border:1px solid #6ff4; background:#0a1020cc; color:#dff; padding:8px;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-family:inherit; cursor:pointer; }
  .tile.sel { border-color:#7fff9a; box-shadow:0 0 12px #5f8a; }
  .tile .pv { position:relative; width:100%; height:76px; }
  .tile canvas { width:100%; height:76px; display:block; }
  .tile.locked canvas { filter:brightness(0) invert(.3); opacity:.75; }
  .tile .lock { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; }
  .tile .nm { font-weight:bold; font-size:15px; }
  .tile.locked .nm { color:#889; }
  .tile .st { font-size:12px; color:#8ab; }
  .tile.sel .st { color:#7fff9a; font-weight:bold; }
  #telToggle { width:auto; margin:0; transform:scale(1.4); }
  #telStat { color:#889; font-size:12px; margin-top:4px; }
  #rate { position:absolute; left:0; right:0; bottom:160px; /* just above the action footer */ z-index:3;
    display:none; flex-direction:column; align-items:center; gap:6px; }
  #rate.show { display:flex; }
  #rateQ { font:bold 17px "Trebuchet MS", system-ui, sans-serif; color:#dff; text-shadow:0 0 8px #0ff8; }
  #rateRow { display:flex; gap:14px; }
  #rateRow button { width:64px; height:64px; border-radius:18px; border:1px solid #6ff6; background:#0a1020dd;
    font-size:34px; line-height:1; padding:0; cursor:pointer; }
  #rateRow button.on { border-color:#7fff9a; box-shadow:0 0 14px #5f8a; background:#0e3a4a; transform:scale(1.1); }
  #rateThx { height:18px; font:bold 15px "Trebuchet MS", system-ui, sans-serif; color:#7fff9a; visibility:hidden; }
  #rateThx.show { visibility:visible; }

  /* Fixed logical stage (STAGE_W x STAGE_H), scaled to fit and letterboxed. --s = current scale. */
  html, body { background: radial-gradient(ellipse at center, #120a2a 0%, #05030d 70%); }
  #stage { position:fixed; left:0; top:0; width:450px; height:800px; transform-origin:0 0; overflow:hidden; background:#05030d; --s:1; }
  /* keep small DOM text >= ~12 screen px when the stage is scaled down */
  .tile .st, .tile .nm, #rateThx, #telStat, #panel .hint, .row { font-size:max(12px, calc(12px / var(--s))); }

  #tabs { gap:6px; } #tabs button { font-size:14px; padding:0 2px; }
  .mhead { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; color:#dff; font-size:16px; padding:2px 4px; }
  .mhead b { color:#ffd84d; } .mhead span:last-child i { display:inline-block; vertical-align:middle; height:8px; width:0; max-width:90px; background:#6ff; margin-left:8px; border-radius:4px; }
  .mrow { grid-column:1/-1; display:flex; align-items:center; gap:10px; border:1px solid #6ff4; background:#0a1020cc; border-radius:14px; padding:10px 12px; color:#dff; }
  .mrow .tx { flex:1; } .mrow b { display:block; font-size:16px; } .mrow small { color:#8ab; font-size:max(13px, calc(12px / var(--s))); } .mrow em { display:block; font-style:normal; color:#7fff9a; letter-spacing:2px; font-size:12px; } .mrow em s { text-decoration:none; color:#345; }
  .mrow button { min-height:44px; min-width:84px; border-radius:10px; border:1px solid #7fff9a; background:#0e3a4a; color:#fff; font:bold 15px "Trebuchet MS", system-ui, sans-serif; cursor:pointer; }
  .mrow button:disabled { opacity:.45; border-color:#6ff4; cursor:default; } .mrow.done { border-color:#7fff9a; }

  #mute { position:absolute; top:10px; left:10px; width:42px; height:42px; border-radius:50%; border:1px solid #6ff8; background:#0a1020cc; color:#8ff; font-size:20px; padding:0; cursor:pointer; z-index:5; }

  #pw { position:absolute; left:8px; top:170px; display:none; flex-direction:column; gap:14px; z-index:3; }
  #pw.r { left:auto; right:8px; }
  #pw button { position:relative; width:58px; height:58px; border-radius:50%; border:1px solid #6ff; background:#0a1020dd; color:#8ff; font-size:30px; line-height:1; padding:0; overflow:hidden; cursor:pointer; box-shadow:0 0 12px #0ff5; }
  #pw button span { position:relative; z-index:1; } #pw button i { position:absolute; left:0; right:0; bottom:0; height:0; background:#000a; }
  #pw button.cd { color:#567; border-color:#6ff4; box-shadow:none; } #pw kbd { position:absolute; z-index:1; right:7px; bottom:3px; font:bold 11px sans-serif; color:#ffd84d; }

#priv { position:absolute; left:8px; right:8px; bottom:8px; z-index:6; display:none; background:#0a1020ee; border:1px solid #6ff6; border-radius:10px; padding:8px 10px; font:12px/1.35 system-ui,sans-serif; color:#cde; }
#priv a { color:#6ff; } #priv button { margin-left:6px; padding:3px 12px; border-radius:6px; border:1px solid #6ff8; background:#123; color:#8ff; font-size:12px; cursor:pointer; }

</style>
</head>
<body>
<div id="stage">
<body>
<canvas id="c"></canvas>
<div id="pw"></div>
<button id="mute" aria-label="Mute"></button>
<div id="priv">This game saves your progress on this device and sends anonymous play stats. <a href="privacy.html" target="_blank" rel="noopener">Privacy</a> <button id="privOk">OK</button></div>
<button id="gear" aria-label="Tuning">&#9881;</button>
<div id="panel"><h2>TUNING</h2><div id="rows"></div>
  <div class="row"><label><span>Send stats</span><input type="checkbox" id="telToggle"></label><div id="telStat"></div></div>
  <button class="reset" id="reset">Reset defaults</button>
  <button class="reset" id="unlockAll">Unlock all (testing)</button>
  <button class="reset" id="resetUnlocks">Reset unlocks</button>
  <div class="hint">Changes apply live. Tap the gear to close and resume.</div></div>
<div id="rate"><div id="rateQ">How fun was that?</div>
  <div id="rateRow"><button data-v="1" aria-label="Not fun">&#x1F61E;</button><button data-v="2" aria-label="OK">&#x1F610;</button><button data-v="3" aria-label="Fun">&#x1F600;</button></div>
  <div id="rateThx">Thanks!</div></div>
<button id="collBtn">Collection</button>
<div id="coll"><div class="chead"><button id="collBack">&larr; Back</button><h2>COLLECTION</h2></div>
  <div id="tabs"><button data-k="balls"></button><button data-k="trails"></button><button data-k="upgrades"></button><button data-k="daily"></button></div>
  <div id="grid"></div></div>
</div>

<script>
"use strict";
const BUILD = {"target":"web","devUI":true,"telemetry":true};
// Platform adapter. 'web' = no-ops + localStorage. 'crazygames' = SDK v3 (Basic Launch: init + gameplayStart/Stop only; no ads).
const _cg = () => { try { return BUILD.target === 'crazygames' && window.CrazyGames && window.CrazyGames.SDK; } catch (e) { return null; } };
const PLATFORM = {
  name: BUILD.target,
  locale: (navigator.language || 'en').slice(0, 2),
  ready: false,
  init() { const s = _cg(); if (!s) return; try { Promise.resolve(s.init()).then(() => { PLATFORM.ready = true; try { s.game.loadingStart(); s.game.loadingStop(); if (PLATFORM.playing) s.game.gameplayStart(); } catch (e) {} }).catch(() => {}); } catch (e) {} },
  playing: false,
  gameplayStart() { PLATFORM.playing = true; const s = _cg(); if (s && PLATFORM.ready) try { s.game.gameplayStart(); } catch (e) {} },
  gameplayStop() { PLATFORM.playing = false; const s = _cg(); if (s && PLATFORM.ready) try { s.game.gameplayStop(); } catch (e) {} },
  adBreak(done) { done(); },                      // Full Launch only: midgame ad after game over; always continues if no fill
};
PLATFORM.init();

const TELEMETRY = { url: 'https://ahbfawcyytdrmmxepxjy.supabase.co/rest/v1/runs', key: 'sb_publishable_pWDVpRghWtIJLmDtPlQqag_lGzBQU3x', enabled: BUILD.telemetry && !/[?&]notel=1/.test(location.search) };
const GAME_VERSION = '0.5.0-dev' + (BUILD.target === 'web' ? '' : '+' + BUILD.target);
// ============================================================
// CONFIG: fixed constants + tunable params (exposed in panel)
// ============================================================
const CONFIG = {
  ballRadius: 13,
  ringRadius: 64,          // visual target ring radius
  startHealth: 100,
  step: 1 / 120,           // fixed physics timestep (s)
  maxFrame: 0.1,           // dt clamp (s)
  footerFrac: 0.19,        // footer HUD band height as fraction of viewport
  edgeLossBase: 1.0,       // edge loss = tuned lossRate*edgeMult*edgeLossBase per s
  stageSeconds: 30,        // seconds (at ramp 1) per background stage
  // Fixed force scalings (the sliders multiply these)
  repulsionUnit: 1.0,      // accel per px beyond sweet spot, per slider unit
  driftUnit: 20,           // px/s^2 per slider unit
  // Palette stages: [bgA, bgB, accent1, accent2, obstacleColour]
  palettes: [
    ['#06061a', '#14083a', '#00e5ff', '#9b5cff', '#2bd9ff'],
    ['#12041f', '#2a0640', '#ff2bd6', '#7a5cff', '#ff4de0'],
    ['#1c0407', '#3a0a0a', '#ff3b30', '#ff9a1f', '#ff6a2b'],
    ['#2a0000', '#000000', '#ff1a1a', '#ffee00', '#ffffff'],
    ['#00141a', '#001f1a', '#00ffa3', '#00c2ff', '#7dffd4'],
    ['#1a1200', '#2e1a00', '#ffb300', '#ff5e00', '#ffd966'],
    ['#10001f', '#05000d', '#c200ff', '#00f0ff', '#f0b3ff'],
    ['#000000', '#1a0010', '#ffffff', '#ff0066', '#ff0066']
  ],
  // Tunables: key -> [default, min, max, step, label]
  tune: {
    sweet:   [24,  8,  60, 1,    'Sweet spot radius'],
    repel:   [4.5, 0,  14, 0.1,  'Repulsion strength'],
    pull:    [0.35, 0, 2,  0.05, 'Centre pull'],
    up:      [22,  0, 120, 1,    'Upward bias'],
    drift:   [3.0, 0, 10,  0.1,  'Random drift strength'],
    damp:    [1.3, 0.2, 4, 0.05, 'Damping'],
    loss:    [4.5, 0, 20,  0.1,  'Health loss rate'],
    edge:    [4,   1, 15,  0.5,  'Edge damage multiplier'],
    spawn:   [1.0, 0.2, 4, 0.05, 'Obstacle spawn rate'],
    ramp:    [1.0, 0, 3,   0.05, 'Difficulty ramp speed'],
    maxSpeed:[450, 100, 2000, 10, 'Max ball speed (px/s)'],
    bounce:  [0.8, 0.3, 1.2, 0.05, 'Edge bounciness'],
    kick:    [70,  0, 300, 5,    'Edge kick (min inward px/s)']
  }
};
const STORE_BEST = 'scrollgame.best', STORE_TUNE = 'scrollgame.tune';

// Tunable values (live)
const T = {};
for (const k in CONFIG.tune) T[k] = CONFIG.tune[k][0];
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
(function loadTune() {
  try {
    const s = JSON.parse(lsGet(STORE_TUNE) || '{}');
    for (const k in T) if (typeof s[k] === 'number' && isFinite(s[k])) T[k] = s[k];
  } catch (e) {}
})();

// ============================================================

// Canvas + sizing
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const STAGE_W = 450, STAGE_H = 800;                  // fixed logical stage: identical physics/difficulty on every device
let W = STAGE_W, H = STAGE_H, DPR = 1, SCALE = 1, RS = 1, PH = 520, FH = 120, SAFE_B = 0; // PH = play-area height (footer starts at y=PH); RS = DPR*SCALE
const stageEl = document.getElementById('stage');
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const vw = window.innerWidth, vh = window.innerHeight;
  SCALE = Math.min(vw / STAGE_W, vh / STAGE_H); RS = DPR * SCALE;
  stageEl.style.transform = 'translate(' + ((vw - STAGE_W * SCALE) / 2) + 'px,' + ((vh - STAGE_H * SCALE) / 2) + 'px) scale(' + SCALE + ')';
  stageEl.style.setProperty('--s', SCALE);
  FH = Math.round(H * CONFIG.footerFrac); PH = H - FH;
  canvas.width = Math.round(W * RS); canvas.height = Math.round(H * RS);
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  if (game.target) { game.target.x = clamp(game.target.x, 0, W); game.target.y = clamp(game.target.y, 0, PH); }
  if (game.ball) { game.ball.x = clamp(game.ball.x, game.ball.r, W - game.ball.r); game.ball.y = clamp(game.ball.y, game.ball.r, PH - game.ball.r); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

// ============================================================
// Helpers
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);            // cosmetic randomness only
let _seed = (Math.random() * 4294967296) >>> 0;                 // simulation RNG (mulberry32): seedable for deterministic tests
function seedSim(s) { _seed = s >>> 0; }
function srng() { _seed = (_seed + 0x6D2B79F5) >>> 0; let t = _seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const srand = (a, b) => a + srng() * (b - a);
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')';
}
function rgba(h, a) { const c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
// Palette (smoothly interpolated) for a fractional stage value
function palette(stageF) {
  const P = CONFIG.palettes, i = Math.min(P.length - 1, Math.floor(stageF)), j = Math.min(P.length - 1, i + 1);
  const t = clamp(stageF - i, 0, 1), s = t * t * (3 - 2 * t);
  return P[i].map((c, n) => mixHex(c, P[j][n], s)).map(rgbToHex);
}
function rgbToHex(s) {
  const m = s.match(/\d+/g).map(Number);
  return '#' + m.map(v => v.toString(16).padStart(2, '0')).join('');
}

// ============================================================
// Game state
// ============================================================
const game = {
  state: 'start',            // start | play | over
  paused: false,             // visibility/panel pause
  t: 0,                      // survival time
  health: CONFIG.startHealth, maxHealth: CONFIG.startHealth, runSum: null,
  best: parseFloat(lsGet(STORE_BEST)) || 0,
  newBest: false,
  ball: null, target: null, obstacles: [], trailSt: null, unlockedNow: [], dirX: 0, dirY: -1,
  drift: { x: 0, y: 0, tx: 0, ty: 0, timer: 0 },
  spawnTimer: 1.5,
  shake: 0, flash: 0, edgeTouch: false,
  overAt: 0, acc: 0,
  bgT: 0, bgOff: { x: 0, y: 0 }, blobs: []
};
game.stageF = () => game.state === 'play' || game.state === 'over' ? diffTime() / CONFIG.stageSeconds : 0.0;
// Effective "difficulty time" (seconds scaled by ramp speed)
// First-run easing: runs 1-2 ramp slower so new players reach the 60s mark
function easeF() { const r = typeof prog !== 'undefined' ? prog.runs : 9; return r < 1 ? 0.6 : r < 2 ? 0.75 : r < 4 ? 0.9 : 1; }
function diffTime() { return game.t * T.ramp * easeF(); }
// Difficulty level: 0 at start, ~1 at 60s with ramp 1
function level() { return diffTime() / 60; }

function initBlobs() {
  game.blobs = [];
  for (let i = 0; i < 7; i++) game.blobs.push({ x: Math.random(), y: Math.random(), r: rand(0.25, 0.6),
    vx: rand(-0.02, 0.02), vy: rand(-0.02, 0.02), c: i % 2 });
}
initBlobs();

function resetRun() {
  game.pw = newPw(); game.pwUsed = 0; MOD.sweetTemp = 0; MOD.calm = 1; game.t = 0; game.maxHealth = CONFIG.startHealth * MOD.hp; game.health = game.maxHealth; game.newBest = false;
  game.obstacles = []; game.trailSt = newTrailSt(); game.unlockedNow = []; game.spawnTimer = 1.5;
  game.shake = 0; game.flash = 0; game.acc = 0;
  game.target = { x: W / 2, y: PH * 0.32 };
  game.ball = { x: W / 2, y: PH * 0.32, vx: 0, vy: 0, r: CONFIG.ballRadius };
  game.drift = { x: 0, y: 0, tx: 0, ty: 0, timer: 0 };
}
function startRun() { meta.notice = []; meta.pending = null; telRunStart(); resetRun(); game.state = 'play'; telBegin(); PLATFORM.gameplayStart(); Audio_.sfx('start'); Audio_.music(true); }
function endRun() {
  game.state = 'over'; game.overAt = performance.now(); PLATFORM.gameplayStop(); Audio_.music(false); Audio_.sfx('over');
  const s = game.t;
  if (s > game.best) { game.best = s; game.newBest = true; lsSet(STORE_BEST, String(s)); }
  game.unlockedNow = recordRun(s); game.runSum = metaOnRunEnd(s, game.newBest); if (game.unlockedNow.length || game.runSum.lines.length) setTimeout(() => Audio_.sfx('unlock'), 500);
  telEnd();
}


// ============================================================
// Input (relative drag)
// ============================================================
let drag = null; // {id, x, y}
function onDown(e) {
  if (e.target !== canvas) return;
  e.preventDefault();
  Audio_.unlock(); telTouch(); lastPtr = e.pointerType === 'touch' ? 'touch' : 'mouse';
  if (game.paused || panelOpen || collOpen) return;
  if (game.state === 'start') { startRun(); }
  else if (game.state === 'over') {
    if (performance.now() - game.overAt > 600) startRun();
    return;
  }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  if (game.state === 'play' && !game.paused && !panelOpen && game.target) {
    if (rs) rs.drag += Math.hypot(e.clientX - drag.x, e.clientY - drag.y) / SCALE;
    game.target.x = clamp(game.target.x + (e.clientX - drag.x) / SCALE, 0, W);
    game.target.y = clamp(game.target.y + (e.clientY - drag.y) / SCALE, 0, PH);
  }
  drag.x = e.clientX; drag.y = e.clientY;
}
function onUp(e) { if (drag && e.pointerId === drag.id) drag = null; }
canvas.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
// Block page scroll / zoom / pull-to-refresh
document.addEventListener('touchmove', e => { if (!e.target.closest('#panel, #grid')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
window.addEventListener('blur', autoPause);

// ============================================================
// Tuning panel
// ============================================================
let panelOpen = false;
const panel = document.getElementById('panel'), rowsEl = document.getElementById('rows');
const inputs = {};
function fmt(k, v) { const st = CONFIG.tune[k][3]; return v.toFixed(st < 1 ? (st < 0.1 ? 2 : 1) : 0); }
(function buildPanel() {
  for (const k in CONFIG.tune) {
    const [, mn, mx, st, label] = CONFIG.tune[k];

// ============================================================
// Obstacles
// ============================================================
function spawnObstacle() {
  const L = level(), r = srng();
  const kind = r < 0.4 ? 'circle' : r < 0.75 ? 'rect' : 'tri';
  const sizeMul = 1 + 0.5 * L;
  const speed = srand(45, 80) * (1 + 0.45 * L);
  // Enter from top, left or right; travel across the screen
  const side = srng();
  let x, y, ang;
  if (side < 0.5) { x = srand(0, W); y = -90; ang = Math.PI / 2 + srand(-0.6, 0.6); }
  else if (side < 0.75) { x = -90; y = srand(0, PH * 0.7); ang = srand(-0.3, 0.7); }
  else { x = W + 90; y = srand(0, PH * 0.7); ang = Math.PI - srand(-0.3, 0.7); }
  const o = { kind, x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, rot: srand(0, 6.28), spin: srand(-0.6, 0.6),
    seen: false, hue: srng() };
  if (kind === 'rect') { // wall (axis-aligned for collision)
    const horiz = srng() < 0.5, len = srand(90, 170) * sizeMul, th = srand(16, 24) * Math.min(sizeMul, 1.8);
    o.w = horiz ? len : th; o.h = horiz ? th : len; o.spin = 0; o.rot = 0;
  } else { o.r = srand(24, 42) * sizeMul; }
  game.obstacles.push(o);
}
function collideObstacle(b, o) {
  let nx, ny, pen;
  if (o.kind === 'rect') {
    const hw = o.w / 2, hh = o.h / 2;
    const cx = clamp(b.x, o.x - hw, o.x + hw), cy = clamp(b.y, o.y - hh, o.y + hh);
    let dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
    if (d2 > b.r * b.r) return false;
    if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = b.r - d; }
    else { // centre inside rect: exit along shortest axis
      const px = hw - Math.abs(b.x - o.x), py = hh - Math.abs(b.y - o.y);
      if (px < py) { nx = Math.sign(b.x - o.x) || 1; ny = 0; pen = px + b.r; }
      else { nx = 0; ny = Math.sign(b.y - o.y) || 1; pen = py + b.r; }
    }
  } else {
    const rr = o.kind === 'tri' ? o.r * 0.8 : o.r;
    const dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy);
    if (d > rr + b.r) return false;
    nx = d > 1e-6 ? dx / d : 0; ny = d > 1e-6 ? dy / d : -1; pen = rr + b.r - d;
  }
  b.x += nx * pen; b.y += ny * pen;
  // Impulse: reflect relative velocity + guaranteed shove
  const rvn = (b.vx - o.vx) * nx + (b.vy - o.vy) * ny;
  if (rvn < 0) { b.vx -= 1.5 * rvn * nx; b.vy -= 1.5 * rvn * ny; }
  b.vx += nx * 60; b.vy += ny * 60;
  return true;
}


// Keyboard (secondary control): arrows / WASD move the target; Space / Enter start or retry.
const keys = {}, KSPEED = 380; // stage px/s
function kbDir() { return { x: (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), y: (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0) }; }
window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (/^(Arrow(Up|Down|Left|Right)| )$/.test(k)) e.preventDefault();
  if (k === ' ' || k === 'Enter') {
    Audio_.unlock();
    if (e.repeat || panelOpen || collOpen) return;
    if (game.paused) { game.paused = false; telClearInProg(); return; } // same as tap-to-resume
    lastPtr = 'key';
    if (game.state === 'start') startRun();
    else if (game.state === 'over' && performance.now() - game.overAt > 600) startRun();
    return;
  }
  Audio_.unlock();
  if (k === '1' || k === '2' || k === '3') { usePw(PWS[+k - 1].id); return; }
  keys[e.code] = true;   // physical key position, so WASD works as ZQSD on AZERTY

// ============================================================
// Simulation
// ============================================================
function step(dt) {
  const g = game, b = g.ball, tg = g.target, L = level();
  g.t += dt; pwTick(g, dt);
  const kd = kbDir(); if (kd.x || kd.y) { const n = Math.hypot(kd.x, kd.y); tg.x = clamp(tg.x + kd.x / n * KSPEED * dt, 0, W); tg.y = clamp(tg.y + kd.y / n * KSPEED * dt, 0, PH); }

  // Smooth random drift: lerp toward a periodically re-rolled target vector
  const dr = g.drift;
  dr.timer -= dt;
  if (dr.timer <= 0) {
    dr.timer = srand(0.8, 2.2) / (1 + 0.4 * L);
    const a = srand(0, 6.283); dr.tx = Math.cos(a); dr.ty = Math.sin(a) * 0.8;
  }
  const k = 1 - Math.exp(-dt * 1.6);
  dr.x += (dr.tx - dr.x) * k; dr.y += (dr.ty - dr.y) * k;

  // Forces on the ball (accelerations)
  let ax = 0, ay = 0;
  const dx = b.x - tg.x, dy = b.y - tg.y, d = Math.hypot(dx, dy) || 1e-6;
  const excess = Math.max(0, d - sweetR());
  const repel = T.repel * MOD.calm * (1 + 0.55 * L) * CONFIG.repulsionUnit * excess;   // (a) away from target
  ax += dx / d * repel; ay += dy / d * repel;
  ax += (W / 2 - b.x) * T.pull; ay += (PH * 0.5 - b.y) * T.pull;             // (b) towards screen centre
  ay -= T.up;                                                                // (c) upward bias
  const ds = T.drift * MOD.drift * MOD.calm * (1 + 0.6 * L) * CONFIG.driftUnit;                     // (d) drift
  ax += dr.x * ds; ay += dr.y * ds;
  b.vx += ax * dt; b.vy += ay * dt;
  const damp = Math.exp(-T.damp * dt); b.vx *= damp; b.vy *= damp;
  b.x += b.vx * dt; b.y += b.vy * dt;

  // Obstacles (e): move, collide, cull
  g.spawnTimer -= dt;
  if (g.spawnTimer <= 0) { spawnObstacle(); g.spawnTimer = srand(1.4, 2.4) / (T.spawn * (1 + 0.7 * L)); }
  for (let i = g.obstacles.length - 1; i >= 0; i--) {
    const o = g.obstacles[i];
    o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.spin * dt;
    const m = (o.kind === 'rect' ? Math.max(o.w, o.h) : o.r) + 140;
    if (o.x < -m || o.x > W + m || o.y < -m || o.y > PH + m) {
      if (o.seen || o.age > 8) { g.obstacles.splice(i, 1); continue; }
    }
    o.age = (o.age || 0) + dt;
    if (o.x > -20 && o.x < W + 20 && o.y > -20 && o.y < PH + 20) o.seen = true;
    if (collideObstacle(b, o)) { g.shake = Math.max(g.shake, 3); telHit(o); Audio_.sfx('hit'); }
  }

  // Play-area edges: mirror overshoot, reflect with restitution, guarantee a minimum inward speed
  let edge = false; const e = T.bounce, kick = T.kick;
  const x0 = b.r, x1 = W - b.r, y0 = b.r, y1 = PH - b.r;
  if (b.x < x0) { b.x = Math.min(x1, x0 + (x0 - b.x)); b.vx = Math.max(Math.abs(b.vx) * e, kick); edge = true; }
  else if (b.x > x1) { b.x = Math.max(x0, x1 - (b.x - x1)); b.vx = -Math.max(Math.abs(b.vx) * e, kick); edge = true; }
  if (b.y < y0) { b.y = Math.min(y1, y0 + (y0 - b.y)); b.vy = Math.max(Math.abs(b.vy) * e, kick); edge = true; }
  else if (b.y > y1) { b.y = Math.max(y0, y1 - (b.y - y1)); b.vy = -Math.max(Math.abs(b.vy) * e, kick); edge = true; }
  const newContact = edge && !g.edgeTouch;
  g.edgeTouch = edge; if (newContact) Audio_.sfx('edge');
  // Hard speed cap (not affected by escalation), applied after all forces, pushes and bounces
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > T.maxSpeed) { const f = T.maxSpeed / sp; b.vx *= f; b.vy *= f; }

  // Health: none in sweet spot, grows with distance, much faster on edge
  const lossD = T.loss * (excess / 40) * (1 + 0.5 * L) * (1 - 0.4 * assist());
  let lossE = 0;
  const edgeRate = (T.loss * T.edge * CONFIG.edgeLossBase * 1.5 + 6) * (1 - 0.4 * assist());
  if (edge) { lossE = edgeRate + (newContact ? 0.15 * edgeRate / dt : 0); g.shake = Math.max(g.shake, 4); g.flash = Math.min(0.35, g.flash + dt * 2); }
  const loss = lossD + lossE;
  if (loss > 0) { const f = Math.min(g.health, loss * dt) / loss; telStep(dt, d, edge, lossD * f, lossE * f); }
  else telStep(dt, d, edge, 0, 0);
  g.health -= loss * dt;
  if (g.health <= 0) { g.health = 0; endRun(); }
}

function update(frameDt) {
  const g = game;
  g.bgT += frameDt; Audio_.setIntensity(Math.min(3, Math.floor(g.stageF())));
  // Background always drifts
  const sf = g.stageF();
  g.bgOff.x += Math.cos(g.bgT * 0.17) * 22 * frameDt * (1 + sf);
  g.bgOff.y += (14 + Math.sin(g.bgT * 0.11) * 10) * frameDt * (1 + sf);
  for (const bl of g.blobs) {
    bl.x += bl.vx * frameDt * (1 + sf); bl.y += bl.vy * frameDt * (1 + sf);
    if (bl.x < -0.2 || bl.x > 1.2) bl.vx *= -1;
    if (bl.y < -0.2 || bl.y > 1.2) bl.vy *= -1;
  }
  g.shake *= Math.exp(-frameDt * 10); g.flash *= Math.exp(-frameDt * 6);
  if (g.state === 'play' && !g.paused && !panelOpen) {
    g.acc += frameDt;
    while (g.acc >= CONFIG.step && g.state === 'play') { step(CONFIG.step); g.acc -= CONFIG.step; }
  }
  if (g.ball) { // cosmetic: smoothed travel direction + trail
    const sp = Math.hypot(g.ball.vx, g.ball.vy), k = 1 - Math.exp(-frameDt * 10);
    if (sp > 8) { g.dirX += (g.ball.vx / sp - g.dirX) * k; g.dirY += (g.ball.vy / sp - g.dirY) * k; }
    trailUpdate(g.trailSt, selItem('trails').id, g.ball.x, g.ball.y, frameDt, g.state === 'play' && !g.paused && !panelOpen);
  }
}

// ---- Persistence + unlock rules ----
function lsJSON(k, def) { try { const v = JSON.parse(lsGet(k)); return v == null ? def : v; } catch (e) { return def; } }
const prog = { runs: 0, best: 0 };
(function () { const s = lsJSON(STORE_PROG, {}); prog.runs = +s.runs || 0; prog.best = Math.max(+s.best || 0, game.best); })();
const unlocked = new Set((function () { const a = lsJSON(STORE_UNLOCKS, []); return Array.isArray(a) ? a : []; })());
const sel = { balls: 'orb', trails: 'classic' };
(function () { const s = lsJSON(STORE_SEL, {}); for (const k in sel) if (typeof s[k] === 'string') sel[k] = s[k]; })();
const ukey = (kind, it) => kind + ':' + it.id;
const isUnlocked = (kind, it) => !it.unlock || unlocked.has(ukey(kind, it));
function selItem(kind) { const l = LISTS[kind], it = l.find(i => i.id === sel[kind]); return it && isUnlocked(kind, it) ? it : l[0]; }
function unlockText(it) { return it.unlock.type === 'level' ? 'Reach level ' + it.unlock.v : it.unlock.type === 'time' ? 'Survive ' + it.unlock.v + 's' : 'Play ' + it.unlock.v + ' runs'; }
function unlockMet(it) { const u = it.unlock; return !u || (u.type === 'level' ? playerLvl() >= u.v : u.type === 'time' ? prog.best >= u.v : prog.runs >= u.v); }
function saveCosm() {
  lsSet(STORE_PROG, JSON.stringify(prog)); lsSet(STORE_UNLOCKS, JSON.stringify(Array.from(unlocked))); lsSet(STORE_SEL, JSON.stringify(sel));
}
function countUnlocked(kind) { return LISTS[kind].filter(it => isUnlocked(kind, it)).length; }
// Called at game over: updates stats, returns names of newly unlocked items
function recordRun(seconds) {
  prog.runs++; prog.best = Math.max(prog.best, seconds);
  const fresh = [];
  for (const kind in LISTS) for (const it of LISTS[kind]) {
    if (!isUnlocked(kind, it) && unlockMet(it)) { unlocked.add(ukey(kind, it)); fresh.push(it.name); }
  }
  saveCosm(); return fresh;
}
function unlockAll() { for (const kind in LISTS) for (const it of LISTS[kind]) if (it.unlock) unlocked.add(ukey(kind, it)); saveCosm(); if (collOpen) renderColl(); }
function resetUnlocks() {
  unlocked.clear(); prog.runs = 0; prog.best = 0; sel.balls = 'orb'; sel.trails = 'classic'; saveCosm(); if (collOpen) renderColl();
}

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }

function drawBackground(pal) {
  const g = game, sf = g.stageF();

    ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, r * 2, r * 2);

  ctx.strokeStyle = rgba(pal[2], 0.10 + 0.04 * sf); ctx.lineWidth = 1; ctx.beginPath();

function drawTarget() {

function uuid() {

  return h.map((v, i) => (i === 4 || i === 6 || i === 8 || i === 10 ? '-' : '') + v.toString(16).padStart(2, '0')).join('');
}

  const br = /EdgA?\/|EdgiOS/.test(ua) ? 'Edge' : /OPR\/|Opera/.test(ua) ? 'Opera' : /Firefox|FxiOS/.test(ua) ? 'Firefox'
    : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'Other';

          headers: { apikey: TELEMETRY.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' } });
      } catch (e) { break; }

/* 10-audio.js: procedural WebAudio (SFX blips + synthwave loop). No audio assets. */
const Audio_ = (() => {
  const MUTE_KEY = 'scrollgame.mute';
  const SIX = 60 / 124 / 4;            // one 16th note at 124 BPM (s)
  const LOOK = 0.15, TICK = 25;        // scheduler lookahead (s) and interval (ms)
  // [bass root Hz, semitone arpeggio] per bar: Am, F, C, G

    [130.81, [0, 4, 7, 12]], [98.0, [0, 4, 7, 12]]

  // Lazily build the AudioContext and graph; returns null if WebAudio is missing.

    if (ctx) return ctx;

      const AC = window.AudioContext || window.webkitAudioContext;

  function voice(out, type, f0, f1, t, a, d, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + d + 0.05);
  }

  // Short filtered noise tick for hi-hats.
  function hat(t, vol) {
    if (!noise) {
      noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; hp.type = 'highpass'; hp.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    s.connect(hp); hp.connect(g); g.connect(bus);
    s.start(t); s.stop(t + 0.05);
  }

  // Pad: triangle triad one octave above the bass, held for one bar.
  function pad(ch, t) {
    [0, ch[1][1], ch[1][2]].forEach(semi =>
      voice(bus, 'triangle', ch[0] * 2 * Math.pow(2, semi / 12), 0, t, 0.3, 16 * SIX, 0.035));
  }

  function playStep(s, t) {
    const ch = CHORDS[(s >> 4) & 3], lvl = intensity, div = DIV[lvl];
    if (s % 16 === 0) pad(ch, t);
    if (s % div === 0) {
      const k = (s / div) % 4;
      voice(bus, 'sawtooth', ch[0] * Math.pow(2, ch[1][k] / 12), 0, t, 0.005, div * SIX * 0.9, 0.12);
    }
    if (s % 2 === 1) hat(t, lvl ? 0.05 : 0.03);
    if (lvl >= 2 && s % 4 === 2) {
      voice(bus, 'square', ch[0] * 4 * Math.pow(2, ch[1][(s >> 2) % 4] / 12), 0, t, 0.003, SIX * 1.5, 0.035);
    }
  }

  // Lookahead scheduler: queues steps up to LOOK seconds ahead.
  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.02; // recover after throttling
    while (nextT < ctx.currentTime + LOOK) {
      playStep(step, nextT);
      nextT += SIX;
      step = (step + 1) % 64;
    }
  }

  // Start or stop the music loop to match wanted/muted/paused state.
  function syncMusic() {
    if (!ctx) return;
    const on = wanted && !muted && !paused, now = ctx.currentTime;
    if (on && !timer) {
      if (ctx.state !== 'running') return; // retried after resume()
      nextT = now + 0.05; step = 0;
      timer = setInterval(schedule, TICK);
      bus.gain.setTargetAtTime(0.8, now, 0.1); // ~0.3s fade in
      schedule();
    } else if (!on && timer) {
      clearInterval(timer); timer = null;
      bus.gain.setTargetAtTime(0, now, 0.1);   // ~0.3s fade out
    }
  }

  function setMuted(v) {
    muted = !!v;
    try { lsSet(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    if (ctx) master.gain.setTargetAtTime(muted ? 0 : 0.5, ctx.currentTime, 0.02);
    syncMusic();
  }

  // Sound effects: each takes (output node, start time).
  const SFX = {
    start:  (o, t) => { voice(o, 'sawtooth', 220, 880, t, 0.01, 0.25, 0.2); voice(o, 'square', 440, 1320, t + 0.12, 0.01, 0.2, 0.08); },
    hit:    (o, t) => voice(o, 'square', 180, 60, t, 0.005, 0.12, 0.25),
    edge:   (o, t) => voice(o, 'triangle', 1200, 900, t, 0.003, 0.05, 0.15),
    over:   (o, t) => { voice(o, 'sawtooth', 440, 55, t, 0.01, 0.35, 0.3); voice(o, 'triangle', 330, 110, t + 0.12, 0.01, 0.22, 0.15); },
    unlock: (o, t) => [523.25, 659.25, 783.99].forEach((f, i) => voice(o, 'sine', f, 0, t + i * 0.06, 0.005, 0.12, 0.2)),
    buy:    (o, t) => { voice(o, 'square', 660, 0, t, 0.005, 0.1, 0.12); voice(o, 'square', 990, 0, t + 0.07, 0.005, 0.14, 0.12); },
    power:  (o, t) => voice(o, 'sawtooth', 300, 1500, t, 0.02, 0.3, 0.18),
    tick:   (o, t) => voice(o, 'sine', 1800, 0, t, 0.002, 0.03, 0.15)
  };

  return {
    // Call from any pointerdown/keydown. Safe to repeat.
    unlock() {
      const c = ensure();
      if (!c) return;
      try {
        if (!unlocked) { // iOS: play a silent buffer inside the gesture
          unlocked = true;
          const s = c.createBufferSource();
          s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
        }
        if (c.state !== 'running') {
          const p = c.resume();
          if (p && p.then) p.then(syncMusic, () => {});
        }
      } catch (e) {}
      syncMusic();
    },
    sfx(name) {
      const c = ensure(), f = SFX[name];
      if (!c || !f || muted || c.state !== 'running') return;
      if (MIN_GAP[name]) {
        const now = performance.now();
        if (now - (lastAt[name] || 0) < MIN_GAP[name]) return;
        lastAt[name] = now;
      }
      try { f(master, c.currentTime); } catch (e) {}
    },
    music(on) { wanted = !!on; syncMusic(); },
    setIntensity(n) {
      intensity = Math.max(0, Math.min(3, Math.floor(+n || 0)));
      if (ctx) lp.frequency.setTargetAtTime(CUT[intensity], ctx.currentTime, 0.4);
    },
    get muted() { return muted; },
    setMuted(v) { setMuted(v); },
    toggleMute() { setMuted(!muted); return muted; },
    pause() {
      paused = true;
      syncMusic();
      if (ctx) try { ctx.suspend(); } catch (e) {}
    },
    resume() {
      paused = false;
      if (!ensure()) return;
      try {
        const p = ctx.resume();
        if (p && p.then) p.then(syncMusic, () => {});
      } catch (e) {}
      syncMusic();
    }
  };
})();

(function () { // mute button (top-left)
  const b = document.getElementById('mute');
  const sync = () => { b.textContent = Audio_.muted ? '\u{1F507}' : '\u{1F50A}'; };
  for (const ev of ['pointerdown', 'pointerup', 'touchstart', 'mousedown']) b.addEventListener(ev, e => e.stopPropagation());
  b.addEventListener('click', e => { e.stopPropagation(); Audio_.unlock(); Audio_.toggleMute(); sync(); });
  sync();
})();

// Dev-only UI is removed from the DOM entirely in builds without devUI
if (!BUILD.devUI) ['gear', 'panel', 'rate'].forEach(i => { const n = document.getElementById(i); if (n && n.parentNode) n.parentNode.removeChild(n); });
// Non-blocking first-run privacy notice
(function () {
  const el = document.getElementById('priv'), ok = document.getElementById('privOk');
  if (!BUILD.telemetry || !el || lsGet('scrollgame.priv') === '1') { if (el) el.remove(); return; }
  el.style.display = 'block';
  const close = () => { lsSet('scrollgame.priv', '1'); el.remove(); };
  ok.addEventListener('click', close); setTimeout(() => { if (el.parentNode) close(); }, 20000);
})();
// iOS: resume audio inside a click/touchend gesture too
['touchend', 'click'].forEach(ev => document.addEventListener(ev, () => Audio_.unlock(), { capture: true, passive: true }));
// Main loop
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, CONFIG.maxFrame); last = now;
  update(dt); render(); syncCollBtn(); syncPw(); telSyncRate();
  requestAnimationFrame(frame);
}
resize();
resetRun();
window.__TEST_HOOKS = { meta, usePw, render, update, game, T, area: () => ({ W, H, PH, FH }), prog, tel: { get queue() { return tq; }, get pending() { return pending; }, get rs() { return rs; }, get sent() { return tsent; }, flush } }; // test-only hook (Playwright)
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

</script>
</body>
</html>
